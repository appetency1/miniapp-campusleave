<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusLeave · 分身版</title>
<style>
  :root{
    --cream:#FAF4E8;
    --cream-deep:#F2E9D8;
    --ink:#1B2E27;
    --ink-2:rgba(27,46,39,.55);
    --ink-3:rgba(27,46,39,.32);
    --line:rgba(27,46,39,.10);
    --accent:#FF5A2B;
    --accent-deep:#E8451A;
    --accent-tint:#FFE6DC;
    --sans:"PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  body{
    background:#E4DACA;
    font-family:var(--sans);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    padding:60px 40px;min-height:100vh;
  }
  .stage{display:flex;gap:72px;align-items:flex-start;flex-wrap:wrap;justify-content:center;}
  .frame{display:flex;flex-direction:column;align-items:center;gap:16px;}
  .tag{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:rgba(27,46,39,.42);text-transform:uppercase;}

  .phone{
    width:375px;height:812px;background:var(--cream);position:relative;
    border-radius:44px;overflow:hidden;
    box-shadow:0 0 0 1px rgba(0,0,0,.09),0 48px 90px -30px rgba(40,30,10,.40);
  }
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 26px;}

  /* 状态栏 */
  .statusbar{
    height:52px;display:flex;align-items:flex-end;justify-content:space-between;
    padding-bottom:6px;font-family:var(--mono);font-size:12px;font-weight:600;
    flex-shrink:0;
  }
  .sb-icons{display:flex;align-items:center;gap:6px;}
  .sb-bars{display:flex;align-items:flex-end;gap:1.5px;height:9px;}
  .sb-bars i{display:block;width:3px;background:var(--ink);border-radius:.5px;}
  .sb-battery{width:20px;height:10px;border:1.2px solid var(--ink);border-radius:2.5px;position:relative;}
  .sb-battery::after{content:"";position:absolute;inset:2px;width:70%;background:var(--ink);border-radius:1px;}

  /* 顶部问候 */
  .top{
    display:flex;align-items:flex-start;justify-content:space-between;
    padding-top:14px;flex-shrink:0;
  }
  .greet-small{
    font-size:12px;color:var(--ink-3);letter-spacing:.14em;font-weight:600;
    margin-bottom:7px;
  }
  .greet{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.12;}
  .greet em{font-style:normal;color:var(--accent);}
  .datebox{text-align:right;}
  .datebox .d1{font-size:12px;color:var(--ink-3);letter-spacing:.1em;font-weight:600;line-height:1.7;}
  .datebox .d2{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink-3);}

  /* ===== 角色区 ===== */
  .stagewrap{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;min-height:0;
  }

  .mascot{position:relative;width:226px;height:246px;margin-top:-4px;}
  .mascot .ground{
    position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
    width:152px;height:18px;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(43,38,22,.16),rgba(43,38,22,0) 70%);
    animation:groundPulse 3.6s ease-in-out infinite;
  }
  @keyframes groundPulse{0%,100%{transform:translateX(-50%) scale(1);opacity:.9}50%{transform:translateX(-50%) scale(.88);opacity:.6}}

  .body{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    width:180px;height:168px;
    background:radial-gradient(circle at 36% 24%,#FFFFFF 0%,#FFFDF8 42%,#F0E4CE 100%);
    border-radius:52% 52% 44% 44% / 58% 58% 42% 42%;
    box-shadow:
      inset 0 -10px 18px rgba(180,150,105,.16),
      inset 0 8px 14px rgba(255,255,255,.9),
      0 14px 26px -12px rgba(70,50,20,.28);
    animation:float 3.6s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateX(-50%) translateY(0)}
    50%{transform:translateX(-50%) translateY(-9px)}
  }

  /* 呆毛 */
  
  .ahoge{
    position:absolute;left:50%;top:-15px;width:26px;height:23px;margin-left:-4px;
    border-left:2.5px solid #E7D8BC;border-top:2.5px solid #E7D8BC;
    border-radius:14px 0 0 0;transform:rotate(18deg);
    transform-origin:bottom left;
    animation:sway 3.6s ease-in-out infinite;
  }
  @keyframes sway{
    0%,100%{transform:rotate(18deg)}
    50%{transform:rotate(30deg)}
  }

  .eye{
    position:absolute;top:68px;width:10px;height:12px;border-radius:50%;
    background:#22322B;
    animation:blink 5.4s infinite;
  }
  
  .eye.l{left:54px;}
  
  .eye.r{right:54px;}
  @keyframes blink{
    0%,92%,100%{transform:scaleY(1)}
    95%{transform:scaleY(.08)}
  }
  
  .spark{position:absolute;top:70px;width:3.5px;height:3.5px;border-radius:50%;background:#fff;opacity:.9;}
  
  .spark.l{left:56px;}
  
  .spark.r{right:56px;}

  
  .blush{
    position:absolute;top:88px;width:20px;height:11px;border-radius:50%;
    background:rgba(255,110,90,.28);filter:blur(1.5px);
  }
  
  .blush.l{left:36px;}
  
  .blush.r{right:36px;}

  
  .mouth{
    position:absolute;top:92px;left:50%;transform:translateX(-50%);
    width:13px;height:7px;
    border-bottom:2.2px solid #22322B;
    border-radius:0 0 11px 11px;
  }

  .mascot-caption{
    margin-top:14px;text-align:center;
  }
  .mascot-caption .m1{font-size:15px;font-weight:700;letter-spacing:.01em;}
  .mascot-caption .m2{font-size:12px;color:var(--ink-3);margin-top:5px;letter-spacing:.02em;}

  /* 状态条 */
  .statusbar-card{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--accent-tint);
    border-radius:18px;
    padding:15px 18px;
    margin-top:6px;
    flex-shrink:0;
  }
  .sc-left{display:flex;align-items:center;gap:10px;}
  .sc-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}
  .sc-title{font-size:13.5px;font-weight:700;letter-spacing:.01em;}
  .sc-right{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-2);}

  /* 主按钮 */
  .cta{
    width:100%;height:60px;margin-top:14px;border:none;border-radius:20px;
    background:var(--accent);color:#fff;font-family:var(--sans);
    font-size:16px;font-weight:700;letter-spacing:.04em;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:9px;
    box-shadow:0 10px 22px -8px rgba(255,90,43,.65);
    transition:transform .14s ease, box-shadow .22s ease, background .2s;
    flex-shrink:0;
  }
  .cta:hover{background:var(--accent-deep);box-shadow:0 14px 26px -8px rgba(232,69,26,.6);}
  .cta:active{transform:scale(.985);}
  .cta .plus{font-size:20px;font-weight:400;line-height:1;transform:translateY(-1px);}

  .ghost{
    width:100%;height:54px;margin-top:10px;border:1.5px solid var(--line);border-radius:18px;
    background:transparent;color:var(--ink);font-family:var(--sans);
    font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0;
    transition:border-color .2s,background .2s;
  }
  .ghost:hover{border-color:var(--ink-3);background:rgba(27,46,39,.03);}

  /* 底部 tab */
  .tabbar{
    display:flex;align-items:center;justify-content:space-around;
    height:66px;flex-shrink:0;
    border-top:1px solid var(--line);
    margin-top:16px;
  }
  .tab{
    display:flex;flex-direction:column;align-items:center;gap:5px;
    font-size:11px;color:var(--ink-3);letter-spacing:.06em;font-weight:600;
    cursor:pointer;position:relative;padding-top:6px;
  }
  .tab.on{color:var(--ink);}
  .tab.on::before{
    content:"";position:absolute;top:-1px;width:4px;height:4px;border-radius:50%;
    background:var(--accent);
  }

  /* ===== 第二屏：离校 ===== */
  .absent{
    width:180px;height:168px;border-radius:52% 52% 44% 44% / 58% 58% 42% 42%;
    border:2px dashed rgba(27,46,39,.16);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:0;
  }
  .absent span{
    font-family:var(--mono);font-size:9px;letter-spacing:.22em;
    color:var(--ink-3);text-transform:uppercase;
  }
  .countdown{
    font-size:44px;font-weight:800;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;line-height:1;
    color:var(--ink);
  }
  .countdown small{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.06em;margin-left:6px;}

  .info{
    padding-bottom:4px;flex-shrink:0;
  }
  .irow{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 0;border-top:1px solid var(--line);
  }
  .irow:last-child{border-bottom:1px solid var(--line);}
  .irow k{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;}
  .irow v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}

  @media (max-width:900px){body{padding:32px 16px;}.stage{gap:40px;}}
</style>
</head>
<body>

<div class="stage">

  <!-- ============ 屏 1 · 在校 ============ -->
  <div class="frame">
    <div class="phone">
      <div class="screen">

        <div class="statusbar">
          <span>9:41</span>
          <div class="sb-icons">
            <div class="sb-bars"><i style="height:3px"></i><i style="height:5px"></i><i style="height:7px"></i><i style="height:9px"></i></div>
            <div class="sb-battery"></div>
          </div>
        </div>

        <div class="top">
          <div>
            <div class="greet-small">早上好</div>
            <div class="greet">张同学<em>。</em></div>
          </div>
          <div class="datebox">
            <div class="d1">10月17日<br>星期五</div>
          </div>
        </div>

        <div class="stagewrap">
          <div class="mascot">
            <div class="ground"></div>
            <div class="body">
              <div class="ahoge"></div>
              <div class="eye l"></div>
              <div class="eye r"></div>
              <div class="spark l"></div>
              <div class="spark r"></div>
              <div class="blush l"></div>
              <div class="blush r"></div>
              <div class="mouth"></div>
            </div>
          </div>
          <div class="mascot-caption">
            <div class="m1">今天也在校</div>
            <div class="m2">有需要的时候，跟我说一声</div>
          </div>
        </div>

        <div class="statusbar-card">
          <div class="sc-left">
            <div class="sc-dot"></div>
            <span class="sc-title">当前无请假</span>
          </div>
          <span class="sc-right">IN CAMPUS</span>
        </div>

        <button class="cta"><span class="plus">＋</span> 申请请假</button>

        <div class="tabbar">
          <div class="tab on">首页</div>
          <div class="tab">记录</div>
          <div class="tab">消息</div>
          <div class="tab">我的</div>
        </div>

      </div>
    </div>
    <div class="tag">01 / 在校</div>
  </div>

  <!-- ============ 屏 2 · 离校 ============ -->
  <div class="frame">
    <div class="phone">
      <div class="screen">

        <div class="statusbar">
          <span>9:41</span>
          <div class="sb-icons">
            <div class="sb-bars"><i style="height:3px"></i><i style="height:5px"></i><i style="height:7px"></i><i style="height:9px"></i></div>
            <div class="sb-battery"></div>
          </div>
        </div>

        <div class="top">
          <div>
            <div class="greet-small">早上好</div>
            <div class="greet">张同学<em>。</em></div>
          </div>
          <div class="datebox">
            <div class="d1">10月17日<br>星期五</div>
          </div>
        </div>

        <div class="stagewrap">
          <div class="absent"><span>Out of campus</span></div>
          <div class="mascot-caption" style="margin-top:26px;">
            <div class="m1">离校了，还没回来</div>
            <div class="m2">返校时记得定位销假</div>
          </div>
          <div class="countdown" style="margin-top:26px;">12:04:33<small>剩余</small></div>
        </div>

        <div class="info">
          <div class="irow"><k>离校 · 病假</k><v>进行中</v></div>
          <div class="irow"><k>结束时间</k><v>10.17 12:00</v></div>
        </div>

        <button class="cta" style="margin-top:18px;">返校定位并销假</button>
        <button class="ghost">申请续假</button>

        <div class="tabbar">
          <div class="tab on">首页</div>
          <div class="tab">记录</div>
          <div class="tab">消息</div>
          <div class="tab">我的</div>
        </div>

      </div>
    </div>
    <div class="tag">02 / 离校</div>
  </div>

</div>

</body>
</html>
