<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>头部卡 · 三个底色方案</title>
<style>
  :root{
    --ink:#1B2E27;
    --accent:#FF5A2B;
    --sans:"PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  body{
    background:#E9E2D5;font-family:var(--sans);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:56px 40px;
  }
  .wrap{display:flex;gap:40px;flex-wrap:wrap;justify-content:center;align-items:flex-start;}
  .col{display:flex;flex-direction:column;align-items:center;gap:14px;}

  /* ===== 卡片 ===== */
  .hero{
    width:335px;height:210px;
    border-radius:26px;
    padding:20px 20px 16px;
    position:relative;
    display:flex;flex-direction:column;
    box-shadow:0 18px 40px -28px rgba(120,80,30,.65);
  }
  .hero.a{background:linear-gradient(155deg,#FFF4D4 0%,#FFE9AF 100%);}
  .hero.b{background:linear-gradient(155deg,#EDF5E9 0%,#DCEBD5 100%);}
  .hero.c{background:linear-gradient(155deg,#FFEFE7 0%,#FFDCCB 100%);}

  .hero-top{display:flex;align-items:flex-start;justify-content:space-between;flex:1;}

  .h-greet{
    font-size:11.5px;font-weight:700;letter-spacing:.18em;
    color:rgba(60,45,20,.42);
  }
  .h-name{
    font-size:31px;font-weight:800;letter-spacing:-.02em;
    line-height:1.14;margin-top:8px;color:#2A2518;
  }
  .h-name em{font-style:normal;color:var(--accent);}

  .h-meta{
    margin-top:10px;display:flex;align-items:center;gap:7px;
    font-size:12px;font-weight:600;color:rgba(60,45,20,.52);letter-spacing:.02em;
  }
  .h-meta svg{display:block;flex-shrink:0;}
  .h-meta i{
    width:3px;height:3px;border-radius:50%;
    background:rgba(60,45,20,.24);display:block;
  }

  /* 状态行 */
  .h-status{
    display:flex;align-items:center;gap:9px;
    padding-top:13px;
    border-top:1px solid rgba(60,45,20,.13);
    flex-shrink:0;
  }
  .h-status .d{
    width:7px;height:7px;border-radius:50%;
    background:rgba(60,45,20,.22);flex-shrink:0;
  }
  .h-status b{font-size:14px;font-weight:800;letter-spacing:.01em;}
  .h-status span{
    font-size:11.5px;font-weight:500;color:rgba(60,45,20,.45);
    letter-spacing:.01em;
  }

  /* ===== 角色 ===== */
  .hero-r{
    width:136px;height:150px;flex-shrink:0;
    display:flex;align-items:flex-end;justify-content:center;
    margin:-4px -6px -4px 0;
  }
  .mascot{position:relative;width:180px;height:186px;flex-shrink:0;}
  .mascot .ground{
    position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
    width:132px;height:14px;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(120,85,35,.17),rgba(120,85,35,0) 70%);
    animation:groundPulse 3.6s ease-in-out infinite;
  }
  @keyframes groundPulse{
    0%,100%{transform:translateX(-50%) scale(1);opacity:.85}
    50%{transform:translateX(-50%) scale(.9);opacity:.5}
  }
  .body{
    position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
    width:158px;height:146px;
    background:radial-gradient(circle at 36% 22%,#FFFFFF 0%,#FFFCF5 44%,#F1E4CF 100%);
    border-radius:52% 52% 44% 44% / 58% 58% 42% 42%;
    box-shadow:
      inset 0 -9px 16px rgba(180,150,105,.18),
      inset 0 7px 13px rgba(255,255,255,.95),
      0 10px 20px -12px rgba(110,80,30,.4);
    animation:float 3.6s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateX(-50%) translateY(0)}
    50%{transform:translateX(-50%) translateY(-8px)}
  }
  .ahoge{
    position:absolute;left:50%;top:-14px;width:24px;height:21px;margin-left:-3px;
    border-left:2.5px solid #E5D2B0;border-top:2.5px solid #E5D2B0;
    border-radius:13px 0 0 0;transform:rotate(18deg);transform-origin:bottom left;
    animation:sway 3.6s ease-in-out infinite;
  }
  @keyframes sway{0%,100%{transform:rotate(18deg)}50%{transform:rotate(31deg)}}
  .eye{
    position:absolute;top:60px;width:9.5px;height:11.5px;border-radius:50%;
    background:#22322B;animation:blink 5.4s infinite;
  }
  .eye.l{left:48px;}
  .eye.r{right:48px;}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  .spark{position:absolute;top:62px;width:3.2px;height:3.2px;border-radius:50%;background:#fff;opacity:.9;}
  .spark.l{left:50px;}
  .spark.r{right:50px;}
  .blush{
    position:absolute;top:78px;width:18px;height:10px;border-radius:50%;
    background:rgba(255,110,90,.30);filter:blur(1.6px);
  }
  .blush.l{left:31px;}
  .blush.r{right:31px;}
  .mouth{
    position:absolute;top:81px;left:50%;transform:translateX(-50%);
    width:12px;height:6.5px;border-bottom:2.2px solid #22322B;
    border-radius:0 0 12px 12px;
  }
  .mini{transform:scale(.76);transform-origin:center bottom;}

  .cap{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    color:rgba(27,46,39,.42);text-transform:uppercase;text-align:center;
  }
  .cap b{display:block;font-family:var(--sans);font-size:12px;letter-spacing:0;
         color:var(--ink);font-weight:700;margin-bottom:4px;}
</style>
</head>
<body>

<div class="wrap">

  <!-- A 暖黄 -->
  <div class="col">
    <div class="hero a">
      <div class="hero-top">
        <div>
          <div class="h-greet">早上好</div>
          <div class="h-name">张同学<em>。</em></div>
          <div class="h-meta">
            <svg width="14" height="14" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4.6" fill="#F0A228"/>
              <g stroke="#F0A228" stroke-width="1.9" stroke-linecap="round">
                <path d="M12 2.2v2.4M12 19.4v2.4M2.2 12h2.4M19.4 12h2.4M5 5l1.7 1.7M17.3 17.3L19 19M19 5l-1.7 1.7M6.7 17.3L5 19"/>
              </g>
            </svg>
            <span>10月17日 周五</span>
            <i></i>
            <span>晴 22°C</span>
          </div>
        </div>
        <div class="hero-r">
          <div class="mascot mini">
            <div class="ground"></div>
            <div class="body">
              <div class="ahoge"></div>
              <div class="eye l"></div>
              <div class="eye r"></div>
              <div class="spark l"></div>
              <div class="spark r"></div>
              <div class="blush l"></div>
              <div class="blush r"></div>
              <div class="mouth"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="h-status">
        <span class="d"></span><b>在校</b><span>今天没有请假安排</span>
      </div>
    </div>
    <div class="cap"><b>A · 暖黄</b>#FFF4D4 → #FFE9AF</div>
  </div>

  <!-- B 淡绿 -->
  <div class="col">
    <div class="hero b">
      <div class="hero-top">
        <div>
          <div class="h-greet">早上好</div>
          <div class="h-name">张同学<em>。</em></div>
          <div class="h-meta">
            <svg width="14" height="14" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4.6" fill="#F0A228"/>
              <g stroke="#F0A228" stroke-width="1.9" stroke-linecap="round">
                <path d="M12 2.2v2.4M12 19.4v2.4M2.2 12h2.4M19.4 12h2.4M5 5l1.7 1.7M17.3 17.3L19 19M19 5l-1.7 1.7M6.7 17.3L5 19"/>
              </g>
            </svg>
            <span>10月17日 周五</span>
            <i></i>
            <span>晴 22°C</span>
          </div>
        </div>
        <div class="hero-r">
          <div class="mascot mini">
            <div class="ground"></div>
            <div class="body">
              <div class="ahoge"></div>
              <div class="eye l"></div>
              <div class="eye r"></div>
              <div class="spark l"></div>
              <div class="spark r"></div>
              <div class="blush l"></div>
              <div class="blush r"></div>
              <div class="mouth"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="h-status">
        <span class="d"></span><b>在校</b><span>今天没有请假安排</span>
      </div>
    </div>
    <div class="cap"><b>B · 淡绿</b>#EDF5E9 → #DCEBD5</div>
  </div>

  <!-- C 橘粉（原） -->
  <div class="col">
    <div class="hero c">
      <div class="hero-top">
        <div>
          <div class="h-greet">早上好</div>
          <div class="h-name">张同学<em>。</em></div>
          <div class="h-meta">
            <svg width="14" height="14" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4.6" fill="#F0A228"/>
              <g stroke="#F0A228" stroke-width="1.9" stroke-linecap="round">
                <path d="M12 2.2v2.4M12 19.4v2.4M2.2 12h2.4M19.4 12h2.4M5 5l1.7 1.7M17.3 17.3L19 19M19 5l-1.7 1.7M6.7 17.3L5 19"/>
              </g>
            </svg>
            <span>10月17日 周五</span>
            <i></i>
            <span>晴 22°C</span>
          </div>
        </div>
        <div class="hero-r">
          <div class="mascot mini">
            <div class="ground"></div>
            <div class="body">
              <div class="ahoge"></div>
              <div class="eye l"></div>
              <div class="eye r"></div>
              <div class="spark l"></div>
              <div class="spark r"></div>
              <div class="blush l"></div>
              <div class="blush r"></div>
              <div class="mouth"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="h-status">
        <span class="d"></span><b>在校</b><span>今天没有请假安排</span>
      </div>
    </div>
    <div class="cap"><b>C · 橘粉</b>#FFEFE7 → #FFDCCB</div>
  </div>

</div>

</body>
</html>
