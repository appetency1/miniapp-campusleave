<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>校园请假 · 学生端</title>
<style>
/* ============================================================
   校园请假 · 学生端 正式版
   底色沿用官方蓝白体系；首页改为「准假单」语言
   ============================================================ */
:root{
  --brand:#2563C9; --brand-deep:#194089; --brand-press:#1F55AD; --brand-tint:#EEF3FB;
  --ink:#121A26; --ink-2:#5A6577; --ink-3:#78849A; --ink-4:#A9B2C2;
  --bg:#F5F7FA; --surface:#FFFFFF;
  --line:#E2E7EF; --line-weak:#EDF0F5;
  --success:#0B6E4F; --success-tint:#E8F5F0;
  --warning:#A2560A; --warning-tint:#FFF6E5;
  --danger:#C0281E; --danger-tint:#FDEDEC;
  --r-card:12px; --r-btn:8px; --r-tag:3px;
  --rail:#D2DEEF;
  --sp-x:20px;
  --font:"PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --ease:cubic-bezier(.2,0,0,1);
  --spring:cubic-bezier(.34,1.2,.64,1);
}
*,*::before,*::after{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
html,body{margin:0;height:100%;}
body{font-family:var(--font);color:var(--ink);background:#E9EDF2;overflow:hidden;}
button{font-family:inherit;border:0;background:none;padding:0;color:inherit;cursor:pointer;}
h1,h2,h3,p{margin:0;}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}

/* ===== 舞台 ===== */
.stage{height:100vh;display:flex;align-items:center;justify-content:center;gap:40px;padding:24px;}
.device{width:375px;height:812px;flex:0 0 auto;transform-origin:center center;}
.phone{
  position:relative;width:375px;height:812px;background:var(--bg);
  border-radius:38px;overflow:hidden;
  box-shadow:0 24px 60px -24px rgba(18,26,38,.34),0 0 0 1px rgba(18,26,38,.06);
}
@media (max-width:520px){
  body{overflow:auto;background:var(--bg);}
  .stage{padding:0;gap:0;}
  .device{width:100%;height:100dvh;transform:none !important;}
  .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none;}
}

/* ===== 状态栏 ===== */
.statusbar{
  position:absolute;left:0;right:0;top:0;height:44px;z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 26px 0 22px;font-size:12px;font-weight:600;letter-spacing:.02em;
  pointer-events:none;
}
.sb-icons{display:flex;align-items:center;gap:5px;}
.sb-icons svg{display:block;}
.sb-bars{display:flex;align-items:flex-end;gap:2px;height:11px;}
.sb-bars i{width:3px;border-radius:.8px;background:var(--ink);}
.sb-bars i:nth-child(1){height:4.5px}.sb-bars i:nth-child(2){height:6.5px}
.sb-bars i:nth-child(3){height:9px}.sb-bars i:nth-child(4){height:11.5px}

/* ===== 视图 / 屏幕 ===== */
.viewport{position:absolute;left:0;right:0;top:44px;bottom:50px;overflow:hidden;
          transition:bottom .3s var(--ease);}
.phone.is-push .viewport{bottom:0;}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  background:var(--bg);
  transition:transform .32s var(--ease),opacity .32s var(--ease);
}
.screen--hidden{opacity:0;pointer-events:none;}
.screen--enter{transform:translateX(100%);}
.screen--enter.is-on{transform:translateX(0);}
.screen--under{transform:translateX(-24%);opacity:.4;}
.s-body{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:0 var(--sp-x) 24px;}
.s-body::-webkit-scrollbar{width:0}

/* ===== 顶栏 ===== */
.nav{
  flex:0 0 auto;height:44px;display:flex;align-items:center;justify-content:center;
  position:relative;background:var(--bg);
}
.nav__title{font-size:17px;line-height:24px;font-weight:600;letter-spacing:.01em;}
.nav__back{
  position:absolute;left:8px;top:2px;width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  color:var(--ink);
}
.nav__back:active{background:rgba(18,26,38,.05);}
.nav__right{
  position:absolute;right:12px;top:6px;width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
}
.nav__right:active{background:rgba(18,26,38,.05);}
.nav__right .dot{
  position:absolute;right:6px;top:6px;width:6px;height:6px;border-radius:50%;
  background:var(--danger);box-shadow:0 0 0 1.5px var(--bg);
}
.icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;
      stroke-linecap:round;stroke-linejoin:round;display:block;}
.icon--16{width:16px;height:16px;stroke-width:1.8}
.icon--20{width:20px;height:20px}
.icon--22{width:22px;height:22px}
.icon--12{width:12px;height:12px;stroke-width:2}

/* ===== 元信息行 ===== */
.meta{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--sp-x) 14px;font-size:13px;line-height:20px;color:var(--ink-3);
  letter-spacing:.01em;
}
.meta b{font-weight:500;color:var(--ink-2);}
.meta .sep{margin:0 6px;color:var(--ink-4);}

/* ===== 准假单卡片 ===== */
.slip{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:14px 16px 14px;position:relative;overflow:hidden;
}
.slip--tap:active{background:#FBFCFE;}
.slip--overdue{border-color:#EEC9C5;}
.slip--overdue::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--danger);
}
.slip__head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.slip__no{
  font-size:12px;line-height:18px;color:var(--ink-3);letter-spacing:.06em;
  font-variant-numeric:tabular-nums;
}
.seal{
  display:inline-flex;align-items:center;
  padding:2px 6px 2px 7px;border:1px solid currentColor;border-radius:var(--r-tag);
  font-size:10.5px;line-height:15px;font-weight:600;letter-spacing:2px;text-indent:1px;
  flex:0 0 auto;
}
.seal--progress{color:var(--brand);}
.seal--pending{color:var(--warning);}
.seal--approved,.seal--completed{color:var(--success);}
.seal--rejected,.seal--overdue{color:var(--danger);}
.seal--neutral{color:var(--ink-3);}

.slip__kicker{
  margin-top:12px;font-size:12px;line-height:18px;font-weight:600;
  letter-spacing:.14em;color:var(--ink-3);
}
.slip__hero{
  margin-top:2px;display:flex;align-items:baseline;flex-wrap:wrap;
  column-gap:4px;color:var(--brand);
}
.slip__hero .lead{font-size:14px;line-height:24px;font-weight:600;color:var(--ink-2);letter-spacing:.02em;}
.slip__hero b{font-size:38px;line-height:46px;font-weight:600;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
.slip__hero .u{font-size:13px;line-height:20px;font-weight:600;color:var(--ink-2);margin-right:2px;}
.slip__hero--text{font-size:21px;line-height:32px;font-weight:700;color:var(--ink);letter-spacing:-.2px;display:block;}
.slip__hero--danger{color:var(--danger);}
.slip__hero--muted{color:var(--ink-2);}

.slip__range{
  margin-top:6px;font-size:13px;line-height:20px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;letter-spacing:.01em;
}
.slip__range em{font-style:normal;color:var(--ink-4);margin:0 4px;}

.track{margin-top:16px;height:4px;border-radius:2px;background:var(--line-weak);overflow:hidden;}
.track i{display:block;height:4px;border-radius:2px;background:var(--brand);
         transform-origin:left;transform:scaleX(var(--p,0));
         transition:transform .9s var(--ease) .15s;}
.slip--overdue .track i{background:var(--danger);}
.track--steps{margin-top:16px;}
.track--danger i{background:var(--danger);}
.tracklabs{
  display:flex;justify-content:space-between;margin-top:7px;
  font-size:11px;line-height:16px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}

/* 待审批：两点步进 */
.steps{display:flex;align-items:flex-start;margin-top:16px;}
.steps__i{flex:0 0 auto;width:78px;}
.steps__d{
  display:block;width:9px;height:9px;border-radius:50%;
  border:1.5px solid var(--line);background:#fff;
}
.steps__i.is-done .steps__d{background:var(--brand);border-color:var(--brand);}
.steps__i.is-now .steps__d{background:var(--brand);border-color:var(--brand);
  box-shadow:0 0 0 3px rgba(37,99,201,.14);}
.steps__t{margin-top:8px;font-size:12px;line-height:18px;font-weight:600;color:var(--ink);}
.steps__s{margin-top:1px;font-size:11px;line-height:16px;color:var(--ink-3);
          font-variant-numeric:tabular-nums;white-space:nowrap;}
.steps__b{flex:1;height:1.5px;background:var(--line);margin-top:4px;}
.steps__b.is-done{background:var(--brand);opacity:.4;}

/* 逾期提示条 */
.notice{
  margin-top:12px;padding:9px 12px;border-left:2px solid var(--danger);
  background:var(--danger-tint);border-radius:2px;
  font-size:12.5px;line-height:19px;color:var(--danger);
}

/* ===== 首页：通栏状态带 ===== */
.hband{
  background:var(--brand-tint);
  margin:0 calc(-1 * var(--sp-x));
  padding:14px var(--sp-x) 18px;
}
.hband__meta{
  display:flex;align-items:center;justify-content:space-between;
  font-size:11px;line-height:16px;color:var(--ink-2);letter-spacing:.04em;
}
.hband__meta .cls{color:var(--ink-3);letter-spacing:.02em;}
.hband__state{
  margin-top:12px;font-size:12px;line-height:18px;font-weight:600;
  color:var(--brand-deep);letter-spacing:2px;
}
.hband .slip__hero{margin-top:2px;}
.hband .slip__hero b{font-size:50px;line-height:58px;letter-spacing:-1.5px;}
.hband .slip__hero .u{font-size:13px;line-height:20px;}
.hband .slip__hero--text{font-size:20px;line-height:30px;font-weight:700;color:var(--ink);}
.hband .slip__hero--muted{color:var(--ink-2);}
.hband .track{margin-top:14px;background:var(--rail);}
.hband .tracklabs{margin-top:8px;font-size:10px;line-height:14px;}
.hband .steps{margin-top:16px;}

/* 两列信息带（细线，无卡片底） */
.hfacts{
  display:flex;margin:0 calc(-1 * var(--sp-x));
  padding:14px var(--sp-x) 16px;
  border-bottom:1px solid var(--line);
}
.hfacts > div{flex:1;min-width:0;}
.hfacts > div + div{padding-left:16px;border-left:1px solid var(--line);}
.hfacts span{display:block;font-size:11px;line-height:16px;color:var(--ink-3);letter-spacing:.06em;}
.hfacts b{display:block;margin-top:5px;font-size:14px;line-height:22px;font-weight:600;
          font-variant-numeric:tabular-nums;letter-spacing:-.1px;}


.slip__sign{margin-top:14px;border-top:1px solid var(--line-weak);}
.signrow{
  display:flex;align-items:baseline;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--line-weak);
}
.signrow:last-child{border-bottom:0;padding-bottom:0;}
.signrow span{font-size:12px;line-height:18px;color:var(--ink-3);width:32px;flex:0 0 32px;letter-spacing:.06em;}
.signrow b{font-size:13px;line-height:20px;font-weight:600;color:var(--ink);}
.signrow i{font-style:normal;font-weight:400;color:var(--ink-3);margin-left:8px;font-variant-numeric:tabular-nums;}
.signrow--stack{display:block;}
.signrow__long{display:block;margin-top:4px;font-weight:400;line-height:21px;color:var(--ink-2);}
.signrow b.is-danger{color:var(--danger);}

/* 空态 */
.blank{padding:20px 0 4px;}
.blank__t{font-size:21px;line-height:30px;font-weight:700;letter-spacing:-.2px;}
.blank__d{margin-top:6px;font-size:13px;line-height:20px;color:var(--ink-2);}
.duo{display:flex;gap:12px;margin-top:18px;}
.pick{
  flex:1;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:13px 14px;
  transition:transform .16s var(--spring),background .16s,border-color .16s;
}
.pick:active{transform:scale(.98);background:#FBFCFE;border-color:#CFD9E8;}
.pick .icon{color:var(--brand);}
.pick b{display:block;margin-top:11px;font-size:15px;line-height:22px;font-weight:600;}
.pick span{display:block;margin-top:2px;font-size:12px;line-height:18px;color:var(--ink-3);}

/* ===== 区块标题 ===== */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 10px;}
.sec h2{font-size:15px;line-height:22px;font-weight:600;letter-spacing:.02em;}
.sec button{font-size:13px;line-height:20px;color:var(--brand);font-weight:500;}

/* ===== 操作区 ===== */
.act{margin-top:16px;}
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;height:48px;border-radius:var(--r-btn);
  font-size:15px;font-weight:500;letter-spacing:.06em;
  transition:transform .12s ease-out,background .14s;
}
.btn:active{transform:scale(.985);}
.btn--primary{background:var(--brand);color:#fff;}
.btn--primary:active{background:var(--brand-press);}
.btn--outline{background:#fff;border:1px solid #C9D4E4;color:var(--ink);}
.btn--outline:active{background:var(--brand-tint);}
.btn--danger-outline{background:#fff;border:1px solid #E0B3AE;color:var(--danger);}
.btn--danger-outline:active{background:var(--danger-tint);}
.btn--ghost{background:var(--brand-tint);color:var(--brand-deep);}
.btn--sm{height:40px;font-size:14px;width:auto;padding:0 16px;}
.btn[disabled]{opacity:.45;pointer-events:none;}

.links{display:flex;align-items:center;justify-content:center;gap:0;margin-top:6px;}
.links button{
  padding:8px 14px;font-size:13px;line-height:20px;color:var(--brand);font-weight:500;
}
.links button.is-danger{color:var(--danger);}
.act--links{margin-top:2px;}
.act--links .links{margin-top:0;}
.links .div{width:1px;height:12px;background:var(--line);}
.hint{margin-top:8px;text-align:center;font-size:12px;line-height:18px;color:var(--ink-3);}

/* ===== 记录列表 ===== */
.filters{
  display:flex;gap:8px;overflow-x:auto;padding:2px var(--sp-x) 12px;
  margin:0 calc(-1 * var(--sp-x));scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.filters.can-right{-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent 100%);
                   mask-image:linear-gradient(90deg,#000 86%,transparent 100%);}
.filters.can-right.can-left{-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent 100%);
                   mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent 100%);}
.chip{
  flex:0 0 auto;height:30px;padding:0 12px;border-radius:15px;
  border:1px solid var(--line);background:#fff;
  font-size:13px;line-height:28px;color:var(--ink-2);
  transition:background .16s,border-color .16s,color .16s;
}
.chip.is-on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500;}
.rec{
  width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-card);padding:13px 14px;margin-bottom:10px;
  transition:background .14s;
}
.rec:active{background:#FBFCFE;}
.rec__top{display:flex;align-items:center;gap:8px;}
.rec__no{font-size:11.5px;line-height:17px;color:var(--ink-3);letter-spacing:.05em;
         font-variant-numeric:tabular-nums;}
.rec__top .seal{margin-left:auto;}
.rec__range{
  margin-top:7px;font-size:14.5px;line-height:22px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:.01em;
}
.rec__range em{font-style:normal;color:var(--ink-4);margin:0 4px;font-weight:400;}
.rec__sub{margin-top:4px;font-size:12px;line-height:18px;color:var(--ink-3);
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rec__sub--danger{color:var(--danger);}

/* ===== 表单 ===== */
.field{margin-top:18px;}
.field__label{display:flex;align-items:baseline;justify-content:space-between;
             font-size:13px;line-height:20px;font-weight:500;color:var(--ink-2);margin-bottom:8px;}
.field__label i{font-style:normal;font-size:12px;color:var(--ink-4);}
.field__err{font-size:12px;line-height:18px;color:var(--danger);margin-top:6px;}

.scenes{display:flex;gap:12px;}
.scene{
  flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:13px 14px;text-align:left;position:relative;
  transition:border-color .18s,background .18s,box-shadow .18s;
}
.scene .icon{color:var(--ink-2);transition:color .18s;}
.scene b{display:block;margin-top:10px;font-size:15px;line-height:22px;font-weight:600;}
.scene span{display:block;margin-top:2px;font-size:12px;line-height:18px;color:var(--ink-3);}
.scene.is-on{border-color:var(--brand);background:var(--brand-tint);}
.scene.is-on .icon{color:var(--brand);}
.scene.is-on b{color:var(--brand-deep);}
.scene.is-err{border-color:var(--danger);}

.seg{display:flex;background:#EDF0F5;border-radius:8px;padding:3px;gap:3px;}
.seg button{
  flex:1;height:38px;border-radius:6px;font-size:14px;color:var(--ink-2);
  transition:background .18s,color .18s,box-shadow .18s;
}
.seg button.is-on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(18,26,38,.08);}

.rows{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;}
.row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:52px;padding:0 14px;border-bottom:1px solid var(--line-weak);
  font-size:14px;width:100%;text-align:left;
}
.row:last-child{border-bottom:0;}
.row:active{background:#FBFCFE;}
.row__k{color:var(--ink-2);flex:0 0 auto;font-size:13.5px;}
.row__v{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;
        display:flex;align-items:center;gap:6px;}
.row__v.is-empty{color:var(--ink-4);font-weight:400;}
.row__v .icon{color:var(--ink-4);}
textarea{
  width:100%;min-height:84px;resize:none;border:0;outline:none;
  font-family:inherit;font-size:14px;line-height:22px;color:var(--ink);
  background:#fff;display:block;
}
textarea::placeholder,input::placeholder{color:var(--ink-4);}
.textwrap{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);
          padding:12px 14px;}
.textwrap .count{margin-top:6px;text-align:right;font-size:11.5px;line-height:16px;color:var(--ink-4);}
input[type=text],input[type=tel]{
  flex:1;border:0;outline:none;font-family:inherit;font-size:14px;color:var(--ink);
  background:none;text-align:right;font-variant-numeric:tabular-nums;
}

/* ===== 详情 ===== */
.tl{padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:var(--r-card);}
.tl__item{position:relative;padding-left:22px;padding-bottom:16px;}
.tl__item:last-child{padding-bottom:0;}
.tl__item::before{
  content:"";position:absolute;left:0;top:5px;width:7px;height:7px;border-radius:50%;
  background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);
  box-sizing:border-box;
}
.tl__item.is-done::before{background:var(--brand);box-shadow:none;}
.tl__item.is-now::before{background:var(--brand);box-shadow:0 0 0 3px rgba(37,99,201,.14);}
.tl__line{position:absolute;left:3px;top:14px;bottom:2px;width:1px;background:var(--line-weak);}
.tl__item:last-child .tl__line{display:none;}
.tl__item.is-done .tl__line{background:var(--brand);opacity:.35;}
.tl__t{font-size:14px;line-height:22px;font-weight:500;color:var(--ink);}
.tl__item.is-idle .tl__t{color:var(--ink-3);}
.tl__s{margin-top:1px;font-size:12px;line-height:18px;color:var(--ink-3);
       font-variant-numeric:tabular-nums;}

.kv{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;}
.kv__row{display:flex;gap:16px;padding:12px 14px;border-bottom:1px solid var(--line-weak);
         font-size:14px;line-height:22px;}
.kv__row:last-child{border-bottom:0;}
.kv__k{flex:0 0 76px;color:var(--ink-2);font-size:13.5px;}
.kv__v{flex:1;text-align:right;font-weight:500;font-variant-numeric:tabular-nums;}
.kv__row--stack{display:block;}
.kv__row--stack .kv__v{text-align:left;font-weight:400;margin-top:4px;line-height:23px;}
.kv__row--stack .kv__k{flex:none;}

.actionbar{
  flex:0 0 auto;background:#fff;border-top:1px solid var(--line);
  padding:10px var(--sp-x) 12px;
}
.actionbar .links{margin-top:2px;}

/* ===== 消息 ===== */
.msg{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-weak);}
.msg:last-child{border-bottom:0;}
.msg__ic{
  width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:var(--brand-tint);
  color:var(--brand);display:flex;align-items:center;justify-content:center;
}
.msg__ic.is-ok{background:var(--success-tint);color:var(--success);}
.msg__ic.is-no{background:var(--danger-tint);color:var(--danger);}
.msg__b{flex:1;min-width:0;}
.msg__t{font-size:14px;line-height:20px;font-weight:600;}
.msg__t .dot{display:inline-block;width:6px;height:6px;border-radius:50%;
             background:var(--danger);vertical-align:1px;margin-left:6px;}
.msg__d{margin-top:3px;font-size:13px;line-height:20px;color:var(--ink-2);}
.msg__time{font-size:11.5px;line-height:16px;color:var(--ink-4);margin-top:5px;
           font-variant-numeric:tabular-nums;}

/* ===== 我的 ===== */
.me{display:flex;align-items:center;gap:14px;padding:18px 0 20px;}
.me__av{
  width:54px;height:54px;border-radius:50%;background:var(--brand-tint);color:var(--brand-deep);
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;letter-spacing:.04em;
}
.me__n{font-size:17px;line-height:24px;font-weight:600;}
.me__s{margin-top:2px;font-size:12.5px;line-height:18px;color:var(--ink-3);
       font-variant-numeric:tabular-nums;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;
       border:1px solid var(--line);border-radius:var(--r-card);padding:14px 0;}
.stats div{text-align:center;border-right:1px solid var(--line-weak);}
.stats div:last-child{border-right:0;}
.stats b{display:block;font-size:19px;line-height:26px;font-weight:600;
         font-variant-numeric:tabular-nums;}
.stats span{display:block;margin-top:2px;font-size:11.5px;line-height:16px;color:var(--ink-3);}

/* ===== tabbar ===== */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;height:50px;z-index:20;
  display:flex;align-items:stretch;background:rgba(255,255,255,.96);
  border-top:1px solid var(--line);
  transition:transform .3s var(--ease);
}
.tabbar.is-hidden{transform:translateY(100%);}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10px;line-height:12px;color:#8692A4;letter-spacing:.02em;position:relative;
}
.tab .icon{width:22px;height:22px;stroke-width:1.7;}
.tab.is-on{color:var(--brand);}
.tab .pill{
  position:absolute;top:3px;right:calc(50% - 20px);
  min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--danger);
  color:#fff;font-size:9.5px;line-height:14px;text-align:center;font-weight:600;
}

/* ===== 浮层 ===== */
.layer{position:absolute;inset:0;z-index:60;pointer-events:none;}
.layer.is-on{pointer-events:auto;}
.mask{
  position:absolute;inset:0;background:rgba(18,26,38,.42);
  opacity:0;transition:opacity .2s var(--ease);
}
.mask.is-on{opacity:1;}
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:#fff;
  border-radius:16px 16px 0 0;padding:18px var(--sp-x) calc(18px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .3s var(--ease);
  max-height:80%;display:flex;flex-direction:column;
}
.sheet.is-on{transform:translateY(0);}
.sheet__t{font-size:16px;line-height:24px;font-weight:600;text-align:center;margin-bottom:14px;}
.sheet__body{overflow-y:auto;}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.quick button{
  height:36px;padding:0 10px;border-radius:6px;border:1px solid var(--line);
  font-size:13px;color:var(--ink-2);background:#fff;
}
.quick button.is-on{border-color:var(--brand);color:var(--brand);background:var(--brand-tint);}
.dtgrid{display:flex;gap:10px;}
.dtgrid label{flex:1;}
.dtgrid span{display:block;font-size:12px;line-height:18px;color:var(--ink-3);margin-bottom:6px;}
.dtgrid input{
  width:100%;height:44px;border:1px solid var(--line);border-radius:8px;
  padding:0 10px;font-family:inherit;font-size:14px;color:var(--ink);background:#fff;
  font-variant-numeric:tabular-nums;
}
.dlg{
  position:absolute;left:50%;top:50%;width:280px;transform:translate(-50%,-48%) scale(.96);
  background:#fff;border-radius:14px;padding:20px 20px 8px;opacity:0;
  transition:opacity .2s var(--ease),transform .24s var(--spring);
}
.dlg.is-on{opacity:1;transform:translate(-50%,-50%) scale(1);}
.dlg__t{font-size:16px;line-height:24px;font-weight:600;text-align:center;}
.dlg__d{margin-top:8px;font-size:13.5px;line-height:21px;color:var(--ink-2);text-align:center;}
.dlg__b{display:flex;margin-top:18px;border-top:1px solid var(--line-weak);}
.dlg__b button{flex:1;height:46px;font-size:15px;color:var(--ink-2);}
.dlg__b button+button{border-left:1px solid var(--line-weak);color:var(--brand);font-weight:500;}
.dlg__b button.is-danger{color:var(--danger);}
.toast{
  position:absolute;left:50%;bottom:96px;transform:translate(-50%,8px);
  background:rgba(18,26,38,.9);color:#fff;font-size:13px;line-height:20px;
  padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .2s,transform .24s var(--ease);
  max-width:280px;text-align:center;
}
.toast.is-on{opacity:1;transform:translate(-50%,0);}
.loading{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;background:rgba(245,247,250,.94);
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.loading.is-on{opacity:1;pointer-events:auto;}
.spin{
  width:30px;height:30px;border-radius:50%;border:2px solid #D6DFEC;border-top-color:var(--brand);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:13px;line-height:20px;color:var(--ink-2);}

/* ===== 演示控制 ===== */
.panel{
  width:236px;flex:0 0 auto;display:flex;flex-direction:column;gap:8px;
  padding:18px 16px;background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 12px 32px -16px rgba(18,26,38,.18);
}
.panel h3{font-size:11px;line-height:16px;letter-spacing:.18em;color:var(--ink-3);font-weight:600;}
.panel__b{
  display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;
  border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--ink-2);
  text-align:left;transition:background .16s,border-color .16s,color .16s;
}
.panel__b:hover{border-color:#C9D4E4;}
.panel__b.is-on{background:var(--brand);border-color:var(--brand);color:#fff;}
.panel__b b{font-size:10px;letter-spacing:.12em;opacity:.6;font-weight:600;}
.panel p{font-size:11.5px;line-height:17px;color:var(--ink-3);margin-top:2px;}
.panel .hr{height:1px;background:var(--line-weak);margin:6px 0;}
.panel .sw{
  display:flex;align-items:center;justify-content:space-between;
  font-size:12.5px;color:var(--ink-2);padding:4px 0;
}
.panel .sw button{
  width:38px;height:22px;border-radius:11px;background:#DDE3EC;position:relative;
  transition:background .18s;
}
.panel .sw button::after{
  content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:transform .2s var(--spring);box-shadow:0 1px 2px rgba(18,26,38,.2);
}
.panel .sw button.is-on{background:var(--brand);}
.panel .sw button.is-on::after{transform:translateX(16px);}
@media (max-width:900px){.panel{display:none;}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}
</style>
</head>

<div class="stage">
  <div class="device" id="device">

          <span class="sb-bars"><i></i><i></i><i></i><i></i></span>

          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8.2" r="3.8"/><path d="M4.8 20.4v-.8a7.2 7.2 0 0 1 14.4 0v.8"/></svg>

  <aside class="panel">

    <button class="panel__b" data-demo="empty"><b>B</b> 无请假</button>
    <button class="panel__b" data-demo="pending"><b>C</b> 待审批</button>
    <button class="panel__b" data-demo="overdue"><b>D</b> 逾期未销假</button>

<script>
(function () {
'use strict';

/* ============================================================
   1. 数据
   ============================================================ */
function dt(m, d, h, mi) { return new Date(2026, m - 1, d, h, mi || 0, 0); }

const STUDENT = { name: '张同学', sid: '202301001001', major: '计算机科学与技术', cls: '计算机2201班', phone: '138****6621', teacher: '李老师' };

const APPS = [
  { id: 'CL20261019001', scene: 'OFF', type: 'PERSONAL', start: dt(10, 19, 8, 0), end: dt(10, 19, 20, 0),
    status: 'APPROVED', submittedAt: dt(10, 18, 19, 40), approvedAt: dt(10, 18, 20, 15),
    reason: '家中临时有事需返家处理，已与家长沟通，返校后按时完成定位销假。',
    dest: '本市 · 家中', phone: '138****6621', materials: 0 },
  { id: 'CL20261019002', scene: 'OFF', type: 'SICK', start: dt(10, 20, 8, 0), end: dt(10, 21, 18, 0),
    status: 'PENDING', submittedAt: dt(10, 19, 9, 2),
    reason: '发热伴咽痛，已到市第一医院门诊就诊，需休息两天。',
    dest: '市第一医院', phone: '138****6621', materials: 2 },
  { id: 'CL20261009003', scene: 'ON', type: 'SICK', start: dt(10, 9, 9, 0), end: dt(10, 9, 18, 0),
    status: 'COMPLETED', submittedAt: dt(10, 8, 21, 10), approvedAt: dt(10, 9, 7, 40),
    completedAt: dt(10, 9, 17, 40),
    reason: '校医院输液，需在宿舍休息，无法参加当天课程。', dest: '—', phone: '138****6621', materials: 1 },
  { id: 'CL20260928004', scene: 'OFF', type: 'PERSONAL', start: dt(9, 28, 14, 0), end: dt(9, 29, 12, 0),
    status: 'REJECTED', submittedAt: dt(9, 28, 9, 30), approvedAt: dt(9, 28, 10, 20),
    rejectReason: '当日有课程考核，请调整时间后重新提交。',
    reason: '需回家参加亲属婚礼。', dest: '邻市', phone: '138****6621', materials: 0 },
  { id: 'CL20260915005', scene: 'ON', type: 'OTHER', start: dt(9, 15, 10, 0), end: dt(9, 15, 16, 0),
    status: 'WITHDRAWN', submittedAt: dt(9, 15, 8, 10),
    reason: '学院安排外出参加学科竞赛。', dest: '—', phone: '138****6621', materials: 0 },
  { id: 'CL20260902006', scene: 'OFF', type: 'PERSONAL', start: dt(9, 2, 13, 0), end: dt(9, 3, 18, 0),
    status: 'COMPLETED', submittedAt: dt(9, 1, 20, 0), approvedAt: dt(9, 2, 8, 20),
    completedAt: dt(9, 3, 17, 10),
    reason: '参加校外实习面试。', dest: '本市 · 高新区', phone: '138****6621', materials: 0 }
];

let state = {
  now: dt(10, 19, 14, 30),
  tick: true,
  tab: 'home',
  stack: [],
  demo: 'progress',
  heroId: null,
  filter: 'ALL',
  form: null,
  apps: APPS,
  messages: [
    { t: '请假申请已通过', d: '李老师审批通过了你的离校请假（10.19 08:00 — 10.19 20:00）', time: '10.18 20:15', k: 'ok', unread: true },
    { t: '返校提醒', d: '你的请假 20:00 结束，返校后请完成定位销假', time: '10.19 12:00', k: 'info', unread: false },
    { t: '请假申请被驳回', d: '09.28 离校事假：当日有课程考核，请调整时间后重新提交', time: '09.28 10:20', k: 'no', unread: false },
    { t: '材料已提交', d: '病假证明材料 2 张已随申请提交', time: '10.18 19:41', k: 'info', unread: false }
  ]
};

/* ============================================================
   2. 工具
   ============================================================ */
const pad = n => (n < 10 ? '0' + n : '' + n);
const md = d => pad(d.getMonth() + 1) + '.' + pad(d.getDate());
const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const mdhm = d => md(d) + ' ' + hm(d);
const mdCN = d => (d.getMonth() + 1) + '月' + d.getDate() + '日';
const wk = d => '周' + '日一二三四五六'[d.getDay()];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TYPE = { SICK: '病假', PERSONAL: '事假', OTHER: '其他' };
const SCENE = { OFF: '离校', ON: '校内' };

const META = {
  PENDING: { t: '待审批', c: 'pending' },
  APPROVED: { t: '已通过', c: 'approved' },
  IN_PROGRESS: { t: '请假中', c: 'progress' },
  OVERDUE: { t: '逾期', c: 'overdue' },
  COMPLETED: { t: '已销假', c: 'completed' },
  REJECTED: { t: '已驳回', c: 'rejected' },
  WITHDRAWN: { t: '已撤回', c: 'neutral' },
  CANCELLED: { t: '已取消', c: 'neutral' }
};

function displayStatus(a) {
  if (a.status !== 'APPROVED') return a.status;
  if (state.now < a.start) return 'APPROVED';
  if (state.now <= a.end) return 'IN_PROGRESS';
  return 'OVERDUE';
}
const isOverdue = a => displayStatus(a) === 'OVERDUE';
const byId = id => state.apps.filter(a => a.id === id)[0];

function sortRank(a) {
  const s = displayStatus(a);
  if (s === 'IN_PROGRESS' || s === 'OVERDUE') return 0;
  if (s === 'PENDING') return 1;
  if (s === 'APPROVED') return 2;
  return 3;
}
function sorted() {
  return state.apps.slice().sort((a, b) => sortRank(a) - sortRank(b) || b.start - a.start);
}
function heroApp() {
  if (state.demo === 'empty') return null;
  if (state.heroId) return byId(state.heroId) || null;
  return sorted()[0] || null;
}
function unread() { return state.messages.filter(m => m.unread).length; }

/* 剩余 / 已过 时长拆分 */
function parts(ms) {
  ms = Math.max(0, ms);
  const m = Math.floor(ms / 60000), day = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mi = m % 60;
  if (day > 0) return [{ n: day, u: '天' }, { n: h, u: '小时' }];
  if (h > 0) return [{ n: h, u: '小时' }, { n: mi, u: '分' }];
  return [{ n: mi, u: '分钟' }];
}
function partsText(ms) {
  const ps = parts(ms).filter(p => p.n > 0);
  return (ps.length ? ps : parts(ms)).map(p => p.n + ' ' + p.u).join(' ');
}

/* ============================================================
   3. 组件
   ============================================================ */
function seal(status) {
  const m = META[status] || META.PENDING;
  return '<span class="seal seal--' + m.c + '">' + m.t + '</span>';
}
function heroNums(lead, ms, opt) {
  opt = opt || {};
  const ps = parts(ms);
  return '<div class="slip__hero' + (opt.cls ? ' ' + opt.cls : '') + '">' +
    '<span class="lead">' + lead + '</span>' +
    ps.map(p => '<b data-n>' + p.n + '</b><span class="u">' + p.u + '</span>').join('') +
    '</div>';
}
function heroText(text, cls) {
  return '<div class="slip__hero slip__hero--text' + (cls ? ' ' + cls : '') + '">' + esc(text) + '</div>';
}

/* 进度条 */
function track(pct, overdue) {
  const p = Math.max(0, Math.min(1, pct));
  return '<div class="track' + (overdue ? ' track--danger' : '') + '">' +
    '<i data-p="' + p.toFixed(4) + '" style="transform:scaleX(0)"></i></div>';
}

/* 三点步进（待审批） */
function steps(nodes) {
  return '<div class="steps">' + nodes.map((n, i) =>
    '<div class="steps__i ' + (n.s || '') + '"><span class="steps__d"></span>' +
    '<div class="steps__t">' + n.t + '</div><div class="steps__s">' + n.s2 + '</div></div>' +
    (i < nodes.length - 1 ? '<div class="steps__b' + (n.s === 'is-done' && nodes[i + 1] && nodes[i + 1].s === 'is-done' ? ' is-done' : '') + '"></div>' : '')
  ).join('') + '</div>';
}

/* 准假单主卡 */
function slipHTML(a) {
  const ds = displayStatus(a);
  const od = ds === 'OVERDUE';
  const kicker = SCENE[a.scene] + ' · ' + TYPE[a.type];
  let hero = '', visual = '', sign = '';

  if (ds === 'IN_PROGRESS') {
    hero = heroNums('还剩', a.end - state.now);
    const pct = (state.now - a.start) / (a.end - a.start);
    visual = track(pct) +
      '<div class="tracklabs"><span>已过 ' + partsText(state.now - a.start) + '</span><span>共 ' + partsText(a.end - a.start) + '</span></div>';
  } else if (od) {
    hero = heroNums('逾期', state.now - a.end, { cls: 'slip__hero--danger' });
    visual = track(1, true) +
      '<div class="tracklabs"><span>' + hm(a.end) + ' 已到期</span><span>未销假</span></div>';
  } else if (ds === 'PENDING') {
    hero = heroText('等待' + STUDENT.teacher + '审批');
    visual = steps([
      { t: '已提交', s2: mdhm(a.submittedAt), s: 'is-done' },
      { t: '辅导员审批', s2: '处理中', s: 'is-now' }
    ]);
  } else if (ds === 'APPROVED') {
    hero = heroNums('还有', a.start - state.now);
    visual = '<div class="tracklabs"><span>' + mdCN(a.start) + ' ' + hm(a.start) + ' 开始</span>' +
      '<span>共 ' + partsText(a.end - a.start) + '</span></div>';
  } else if (ds === 'COMPLETED') {
    hero = heroText('本次请假已完成', 'slip__hero--muted');
  } else if (ds === 'REJECTED') {
    hero = heroText('申请未通过', 'slip__hero--muted');
  } else {
    hero = heroText('本次申请已关闭', 'slip__hero--muted');
  }

  /* 签署行：只补步进/正文没有的事实，不重复 */
  if (ds === 'PENDING') {
    sign = '';
  } else if (ds === 'REJECTED') {
    sign = '<div class="signrow"><span>审批</span><b>' + STUDENT.teacher + '<i>' + mdhm(a.approvedAt) + '</i></b></div>' +
      '<div class="signrow signrow--stack"><span>原因</span><b class="signrow__long">' + esc(a.rejectReason) + '</b></div>';
  } else if (ds === 'WITHDRAWN' || ds === 'CANCELLED') {
    sign = '<div class="signrow"><span>提交</span><b>' + mdhm(a.submittedAt) + '</b></div>' +
      '<div class="signrow"><span>状态</span><b>本人已' + (ds === 'WITHDRAWN' ? '撤回' : '取消') + '</b></div>';
  } else if (od) {
    sign = '<div class="signrow"><span>审批</span><b>' + STUDENT.teacher + '<i>' + mdhm(a.approvedAt) + '</i></b></div>' +
      '<div class="signrow"><span>销假</span><b class="is-danger">未完成</b></div>';
  } else {
    sign = '<div class="signrow"><span>审批</span><b>' + STUDENT.teacher + '<i>' + mdhm(a.approvedAt) + '</i></b></div>' +
      '<div class="signrow"><span>销假</span><b>' + (a.scene === 'OFF' ? '返校定位' : '自主确认') +
      (a.completedAt ? '<i>' + mdhm(a.completedAt) + '</i>' : '') + '</b></div>';
  }

  return '<div class="slip' + (od ? ' slip--overdue' : '') + ' slip--tap" data-act="open" data-id="' + a.id + '">' +
    '<div class="slip__head"><span class="slip__no">' + a.id + '</span>' + seal(ds) + '</div>' +
    '<div class="slip__kicker">' + kicker + '</div>' +
    hero +
    '<div class="slip__range">' + md(a.start) + ' ' + hm(a.start) + '<em>—</em>' + md(a.end) + ' ' + hm(a.end) + '</div>' +
    visual + sign +
    '</div>';
}

function noticeHTML(a) {
  if (!isOverdue(a)) return '';
  return '<div class="notice">原定 ' + hm(a.end) + ' 结束，请尽快完成销假</div>';
}

function actHTML(a) {
  if (!a) return '';
  const ds = displayStatus(a);
  if (ds === 'IN_PROGRESS') {
    const isOff = a.scene === 'OFF';
    return '<div class="act">' +
      '<button class="btn btn--primary" data-act="checkout" data-id="' + a.id + '">' + (isOff ? '返校定位并销假' : '确认结束本次请假') + '</button>' +
      '<div class="links"><button data-act="extend">申请续假</button><span class="div"></span>' +
      '<button data-act="open" data-id="' + a.id + '">查看详情</button></div></div>';
  }
  if (ds === 'OVERDUE') {
    return '<div class="act"><button class="btn btn--danger-outline" data-act="checkout" data-id="' + a.id + '">立即补销假</button>' +
      '<div class="links"><button data-act="open" data-id="' + a.id + '">查看详情</button></div></div>';
  }
  if (ds === 'PENDING') {
    return '<div class="act act--links"><div class="links">' +
      '<button data-act="open" data-id="' + a.id + '">查看详情</button><span class="div"></span>' +
      '<button class="is-danger" data-act="withdraw" data-id="' + a.id + '">撤回申请</button></div></div>';
  }
  if (ds === 'APPROVED') {
    return '<div class="act act--links"><div class="links">' +
      '<button data-act="open" data-id="' + a.id + '">查看详情</button><span class="div"></span>' +
      '<button class="is-danger" data-act="cancel" data-id="' + a.id + '">取消申请</button></div></div>';
  }
  return '<div class="act"><button class="btn btn--primary" data-act="apply">再请一次</button>' +
    '<div class="links"><button data-act="open" data-id="' + a.id + '">查看详情</button></div></div>';
}

function recHTML(a) {
  const ds = displayStatus(a);
  let sub = '';
  if (ds === 'REJECTED') sub = '<div class="rec__sub rec__sub--danger">' + esc(a.rejectReason) + '</div>';
  else if (ds === 'IN_PROGRESS') sub = '<div class="rec__sub">还剩 ' + partsText(a.end - state.now) + ' · 返校后定位销假</div>';
  else if (ds === 'OVERDUE') sub = '<div class="rec__sub rec__sub--danger">已超过结束时间 ' + partsText(state.now - a.end) + '</div>';
  else if (ds === 'PENDING') sub = '<div class="rec__sub">已提交 ' + partsText(state.now - a.submittedAt) + '，等待审批</div>';
  else if (ds === 'APPROVED') sub = '<div class="rec__sub">' + mdCN(a.start) + ' ' + hm(a.start) + ' 开始</div>';
  else if (ds === 'COMPLETED') sub = '<div class="rec__sub">' + mdhm(a.completedAt) + ' 完成销假</div>';
  else sub = '<div class="rec__sub">本人已撤回</div>';
  return '<button class="rec" data-act="open" data-id="' + a.id + '">' +
    '<div class="rec__top"><span class="rec__no">' + a.id + '</span>' + seal(ds) + '</div>' +
    '<div class="rec__range">' + md(a.start) + ' ' + hm(a.start) + '<em>—</em>' + md(a.end) + ' ' + hm(a.end) + '</div>' +
    sub + '</button>';
}

/* ============================================================
   4. 屏幕
   ============================================================ */
function navHTML(o) {
  o = o || {};
  return '<div class="nav">' +
    (o.back ? '<button class="nav__back" data-act="back" aria-label="返回">' +
      '<svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>' : '') +
    '<div class="nav__title">' + esc(o.title || '') + '</div>' +
    (o.bell ? '<button class="nav__right" data-act="go-messages" aria-label="消息">' +
      '<svg class="icon icon--22" viewBox="0 0 24 24"><path d="M12 3.6a5.6 5.6 0 0 0-5.6 5.6v3.6L4.8 16h14.4l-1.6-3.2V9.2A5.6 5.6 0 0 0 12 3.6z"/><path d="M9.8 19.4a2.4 2.4 0 0 0 4.4 0"/></svg>' +
      (unread() ? '<i class="dot"></i>' : '') + '</button>' : '') +
    '</div>';
}

/* 首页通栏状态带 + 两列信息带 */
function factsHTML(a, ds) {
  let l, r;
  if (ds === 'PENDING') {
    l = ['提交', mdhm(a.submittedAt)];
    r = ['审批', STUDENT.teacher];
  } else if (ds === 'REJECTED') {
    l = ['审批', STUDENT.teacher + ' · ' + mdhm(a.approvedAt)];
    r = ['结果', '未通过'];
  } else if (ds === 'WITHDRAWN' || ds === 'CANCELLED') {
    l = ['提交', mdhm(a.submittedAt)];
    r = ['状态', ds === 'WITHDRAWN' ? '本人撤回' : '本人取消'];
  } else {
    l = ['审批', STUDENT.teacher + ' · ' + mdhm(a.approvedAt)];
    r = ['销假', (a.scene === 'OFF' ? '返校定位' : '自主确认') + (a.completedAt ? ' · ' + mdhm(a.completedAt) : '')];
  }
  return '<div class="hfacts">' +
    '<div><span>' + l[0] + '</span><b>' + esc(l[1]) + '</b></div>' +
    '<div><span>' + r[0] + '</span><b>' + esc(r[1]) + '</b></div></div>';
}

function bandHTML(a) {
  const ds = displayStatus(a);
  const od = ds === 'OVERDUE';
  let hero = '', visual = '';

  if (ds === 'IN_PROGRESS') {
    hero = heroNums('还剩', a.end - state.now);
    const pct = (state.now - a.start) / (a.end - a.start);
    visual = track(pct) +
      '<div class="tracklabs"><span>已过 ' + partsText(state.now - a.start) + '</span><span>共 ' + partsText(a.end - a.start) + '</span></div>';
  } else if (od) {
    hero = heroNums('逾期', state.now - a.end, { cls: 'slip__hero--danger' });
    visual = track(1, true) +
      '<div class="tracklabs"><span>' + hm(a.end) + ' 已到期</span><span>未销假</span></div>';
  } else if (ds === 'PENDING') {
    hero = heroText('等待' + STUDENT.teacher + '审批');
    visual = steps([
      { t: '已提交', s2: mdhm(a.submittedAt), s: 'is-done' },
      { t: '辅导员审批', s2: '处理中', s: 'is-now' }
    ]);
  } else if (ds === 'APPROVED') {
    hero = heroNums('还有', a.start - state.now);
    visual = '<div class="tracklabs"><span>' + mdCN(a.start) + ' ' + hm(a.start) + ' 开始</span>' +
      '<span>共 ' + partsText(a.end - a.start) + '</span></div>';
  } else if (ds === 'COMPLETED') {
    hero = heroText('本次请假已完成', 'slip__hero--muted');
  } else if (ds === 'REJECTED') {
    hero = heroText('申请未通过', 'slip__hero--muted');
  } else {
    hero = heroText('本次申请已关闭', 'slip__hero--muted');
  }

  return '<section class="hband">' +
    '<div class="hband__meta"><span>' + (state.now.getMonth() + 1) + '月' + state.now.getDate() + '日 ' + wk(state.now) + '</span>' +
    '<span class="cls">' + STUDENT.cls + '</span></div>' +
    '<div class="hband__state">' + SCENE[a.scene] + ' · ' + TYPE[a.type] + '</div>' +
    hero + visual + '</section>' + factsHTML(a, ds);
}

function homeScreen() {
  const a = heroApp();
  let body = '';

  if (!a) {
    body = '<div class="blank">' +
      '<div class="blank__t">今天没有请假</div>' +

      '<svg class="icon" viewBox="0 0 24 24"><path d="M5.4 20.6V4.4a1 1 0 0 1 1-1h9.2a1 1 0 0 1 1 1v16.2"/><path d="M2.8 20.6h18.4"/><path d="M12.6 12.2h.01"/></svg>' +
      '<b>离校请假</b><span>返校要定位销假</span></button>' +
      '<button class="pick" data-act="apply" data-scene="ON">' +

    (recentList.length ? '<div class="sec"><h2>最近记录</h2><button data-act="go-records">全部记录</button></div>' +
      recentList.map(recHTML).join('') : '') +
    '</div></section>';
}

function recordsScreen() {
  const F = [['ALL', '全部'], ['IN_PROGRESS', '进行中'], ['PENDING', '待审批'], ['APPROVED', '已通过'], ['COMPLETED', '已销假'], ['REJECTED', '已驳回']];
  const list = sorted().filter(a => {
    if (state.filter === 'ALL') return true;
    const ds = displayStatus(a);
    if (state.filter === 'IN_PROGRESS') return ds === 'IN_PROGRESS' || ds === 'OVERDUE';
    return ds === state.filter;
  });
  return '<section class="screen" data-screen="records">' +
    navHTML({ title: '请假记录' }) +
    '<div class="meta"><span>共 ' + state.apps.length + ' 条申请</span><span>本学期</span></div>' +
    '<div class="s-body">' +
    '<div class="filters">' + F.map(f => '<button class="chip' + (state.filter === f[0] ? ' is-on' : '') + '" data-act="filter" data-f="' + f[0] + '">' + f[1] + '</button>').join('') + '</div>' +
    (list.length ? list.map(recHTML).join('') : '<div class="blank" style="padding-top:60px"><div class="blank__t">该状态下暂无记录</div><div class="blank__d">可切换其他筛选查看</div></div>') +
    '</div></section>';
}

function messagesScreen() {
  const items = state.messages.map((m, i) => {
    const cls = m.k === 'ok' ? ' is-ok' : m.k === 'no' ? ' is-no' : '';
    const ico = m.k === 'ok'

      '<div class="msg__b"><div class="msg__t">' + esc(m.t) + (m.unread ? '<i class="dot"></i>' : '') + '</div>' +
      '<div class="msg__d">' + esc(m.d) + '</div><div class="msg__time">' + m.time + '</div></div></div>';
  }).join('');
  return '<section class="screen" data-screen="messages">' +
    navHTML({ title: '消息' }) +

}

    '<div class="rows" style="margin-top:20px">' +
    '<button class="row"><span class="row__k">我的申请记录</span><span class="row__v"><i style="font-style:normal;color:var(--ink-4)">' + total + '</i><svg class="icon icon--16" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span></button>' +
    '<button class="row"><span class="row__k">消息通知</span><span class="row__v"><i style="font-style:normal;color:var(--ink-4)">' + unread() + '</i><svg class="icon icon--16" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span></button>' +
    '<button class="row"><span class="row__k">辅导员</span><span class="row__v">' + STUDENT.teacher + '</span></button>' +
    '<button class="row"><span class="row__k">联系电话</span><span class="row__v">' + STUDENT.phone + '</span></button>' +
    '</div>' +
    '<div class="rows" style="margin-top:12px">' +
    '<button class="row"><span class="row__k">设置</span><span class="row__v"><svg class="icon icon--16" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span></button>' +
    '<button class="row"><span class="row__k">关于校园请假</span><span class="row__v"><i style="font-style:normal;color:var(--ink-4)">V1.0</i></span></button>' +
    '</div></div></section>';
}

/* ---------- 详情页 ---------- */
function timelineHTML(a) {
  const ds = displayStatus(a);
  const N = [];
  N.push({ t: '提交申请', s: mdhm(a.submittedAt), st: 'done' });
  if (ds === 'PENDING') {
    N.push({ t: '等待辅导员审批', s: STUDENT.teacher + ' · 处理中', st: 'now' });
  } else if (ds === 'REJECTED') {
    N.push({ t: '审批未通过', s: STUDENT.teacher + ' · ' + mdhm(a.approvedAt), st: 'done' });
  } else if (ds === 'WITHDRAWN' || ds === 'CANCELLED') {
    N.push({ t: '本人撤回', s: md(a.submittedAt) + ' 申请关闭', st: 'done' });
  } else {
    N.push({ t: '辅导员审批', s: STUDENT.teacher + ' · ' + mdhm(a.approvedAt), st: 'done' });
    if (ds === 'APPROVED') {
      N.push({ t: '请假开始', s: mdhm(a.start) + ' 预计', st: 'idle' });
      N.push({ t: '请假结束', s: mdhm(a.end) + ' 预计', st: 'idle' });
    } else if (ds === 'IN_PROGRESS' || ds === 'OVERDUE') {
      N.push({ t: '请假开始', s: mdhm(a.start) + ' 已开始', st: 'done' });
      N.push({ t: '请假结束', s: mdhm(a.end) + (ds === 'OVERDUE' ? ' 已到期' : ' 预计'), st: ds === 'OVERDUE' ? 'now' : 'idle' });
    } else {
      N.push({ t: '请假开始', s: mdhm(a.start), st: 'done' });
      N.push({ t: '完成销假', s: mdhm(a.completedAt), st: 'done' });
    }
  }
  return '<div class="tl">' + N.map(n =>
    '<div class="tl__item is-' + n.st + '"><span class="tl__line"></span>' +
    '<div class="tl__t">' + n.t + '</div><div class="tl__s">' + n.s + '</div></div>').join('') + '</div>';
}

function detailScreen(id) {
  const a = byId(id);
  if (!a) return homeScreen();
  const ds = displayStatus(a);
  let rows = '';
  rows += '<div class="kv__row"><span class="kv__k">请假场景</span><span class="kv__v">' + SCENE[a.scene] + '</span></div>';
  rows += '<div class="kv__row"><span class="kv__k">请假类型</span><span class="kv__v">' + TYPE[a.type] + '</span></div>';
  rows += '<div class="kv__row"><span class="kv__k">开始时间</span><span class="kv__v">' + mdhm(a.start) + ' ' + wk(a.start) + '</span></div>';
  rows += '<div class="kv__row"><span class="kv__k">结束时间</span><span class="kv__v">' + mdhm(a.end) + ' ' + wk(a.end) + '</span></div>';
  rows += '<div class="kv__row kv__row--stack"><span class="kv__k">请假理由</span><span class="kv__v">' + esc(a.reason) + '</span></div>';
  if (a.scene === 'OFF') rows += '<div class="kv__row kv__row--stack"><span class="kv__k">离校去向</span><span class="kv__v">' + esc(a.dest) + '</span></div>';
  rows += '<div class="kv__row"><span class="kv__k">联系电话</span><span class="kv__v">' + esc(a.phone) + '</span></div>';
  if (a.materials) rows += '<div class="kv__row"><span class="kv__k">证明材料</span><span class="kv__v">' + a.materials + ' 张</span></div>';
  if (a.rejectReason) rows += '<div class="kv__row kv__row--stack"><span class="kv__k">驳回原因</span><span class="kv__v" style="color:var(--danger)">' + esc(a.rejectReason) + '</span></div>';

  return '<section class="screen" data-screen="detail">' +
    navHTML({ title: '请假详情', back: true }) +
    '<div class="s-body">' +
    slipHTML(a) + noticeHTML(a) +
    '<div class="sec"><h2>审批流程</h2></div>' + timelineHTML(a) +
    '<div class="sec"><h2>申请信息</h2></div><div class="kv">' + rows + '</div>' +
    '</div>' +
    '<div class="actionbar">' + detailActions(a, ds) + '</div>' +
    '</section>';
}
function detailActions(a, ds) {
  if (ds === 'IN_PROGRESS') {
    return '<button class="btn btn--primary" data-act="checkout" data-id="' + a.id + '">' + (a.scene === 'OFF' ? '返校定位并销假' : '确认结束本次请假') + '</button>' +
      '<div class="links"><button data-act="extend">申请续假</button></div>';
  }
  if (ds === 'OVERDUE') {
    return '<button class="btn btn--danger-outline" data-act="checkout" data-id="' + a.id + '">立即补销假</button>';
  }
  if (ds === 'PENDING') {
    return '<button class="btn btn--outline" data-act="withdraw" data-id="' + a.id + '">撤回申请</button>';
  }
  if (ds === 'APPROVED') {
    return '<button class="btn btn--danger-outline" data-act="cancel" data-id="' + a.id + '">取消申请</button>';
  }
  return '<button class="btn btn--primary" data-act="apply">再请一次</button>';
}

/* ============================================================
   5. 路由 / 渲染
   ============================================================ */
const viewport = document.getElementById('viewport');
const phone = document.getElementById('phone');
const tabbar = document.getElementById('tabbar');
const layer = document.getElementById('layer');
const scrollPos = {};

function keyOf() {
  const top = state.stack[state.stack.length - 1];
  if (!top) return state.tab;
  return top.k + ':' + (top.id || '');
}
function screenHTML() {
  const top = state.stack[state.stack.length - 1];
  if (!top) {
    if (state.tab === 'home') return homeScreen();
    if (state.tab === 'records') return recordsScreen();
    if (state.tab === 'messages') return messagesScreen();
    return mineScreen();
  }
  if (top.k === 'detail') return detailScreen(top.id);
  return applyScreen();
}

function render(anim) {
  const prevBody = viewport.querySelector('.s-body');
  const prevKey = viewport.dataset.key;
  if (prevBody && prevKey) scrollPos[prevKey] = prevBody.scrollTop;

  const key = keyOf();
  viewport.innerHTML = screenHTML();
  viewport.dataset.key = key;

  const body = viewport.querySelector('.s-body');
  if (body) body.scrollTop = scrollPos[key] || 0;

  const el = viewport.querySelector('.screen');
  if (anim === 'push') {
    el.classList.add('screen--enter');
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('is-on')));
  } else if (anim === 'pop') {
    el.animate([{ opacity: 0, transform: 'translateX(-10%)' }, { opacity: 1, transform: 'none' }],
      { duration: 220, easing: 'cubic-bezier(.2,0,0,1)' });
  }

  /* 进度条生长 */
  requestAnimationFrame(() => {
    el.querySelectorAll('.track i').forEach(i => {
      i.style.transform = 'scaleX(' + (i.dataset.p || 0) + ')';
    });
  });

  /* 筛选条两端渐隐 */
  const fl = el.querySelector('.filters');
  if (fl) {
    const upd = () => {
      fl.classList.toggle('can-left', fl.scrollLeft > 2);
      fl.classList.toggle('can-right', fl.scrollLeft + fl.clientWidth < fl.scrollWidth - 2);
    };
    upd();
    fl.addEventListener('scroll', upd, { passive: true });
  }

  const push = state.stack.length > 0;
  phone.classList.toggle('is-push', push);
  tabbar.classList.toggle('is-hidden', push);
  updateTabs();
  syncPill();
}

function updateTabs() {
  const on = state.stack.length ? null : state.tab;
  tabbar.querySelectorAll('.tab').forEach(t => t.classList.toggle('is-on', t.dataset.tab === on));
}
function syncPill() {
  const p = document.getElementById('msgPill');
  const n = unread();
  p.textContent = n;
  p.style.display = n ? 'block' : 'none';
}

/* ============================================================
   6. 浮层
   ============================================================ */
let layerCloser = null;
function closeLayer() {
  if (!layerCloser) return;
  const fn = layerCloser;
  layerCloser = null;
  fn();
}
function openSheet(title, inner, onOk) {
  closeLayer();
  layer.innerHTML = '<div class="mask"></div><div class="sheet"><div class="sheet__t">' + title + '</div>' +
    '<div class="sheet__body">' + inner + '</div>' +
    '<button class="btn btn--primary" style="margin-top:16px" data-act="sheet-ok">确定</button></div>';
  layer.classList.add('is-on');
  const mask = layer.querySelector('.mask'), sheet = layer.querySelector('.sheet');
  requestAnimationFrame(() => { mask.classList.add('is-on'); sheet.classList.add('is-on'); });
  const okBtn = layer.querySelector('[data-act="sheet-ok"]');
  okBtn.onclick = () => { if (onOk && onOk() === false) return; closeLayer(); };
  mask.onclick = () => closeLayer();
  layerCloser = () => {
    mask.classList.remove('is-on'); sheet.classList.remove('is-on');
    setTimeout(() => { layer.innerHTML = ''; layer.classList.remove('is-on'); }, 220);
  };
}
function dialog(opt) {
  closeLayer();
  layer.innerHTML = '<div class="mask"></div><div class="dlg">' +
    '<div class="dlg__t">' + esc(opt.title) + '</div>' +
    (opt.desc ? '<div class="dlg__d">' + esc(opt.desc) + '</div>' : '') +
    '<div class="dlg__b"><button data-act="dlg-cancel">取消</button>' +
    '<button data-act="dlg-ok" class="' + (opt.danger ? 'is-danger' : '') + '">' + esc(opt.ok || '确定') + '</button></div></div>';
  layer.classList.add('is-on');
  const mask = layer.querySelector('.mask'), dlg = layer.querySelector('.dlg');
  requestAnimationFrame(() => { mask.classList.add('is-on'); dlg.classList.add('is-on'); });
  mask.onclick = () => closeLayer();
  layer.querySelector('[data-act="dlg-cancel"]').onclick = () => closeLayer();
  layer.querySelector('[data-act="dlg-ok"]').onclick = () => { closeLayer(); setTimeout(() => opt.onOk && opt.onOk(), 120); };
  layerCloser = () => {
    mask.classList.remove('is-on'); dlg.classList.remove('is-on');
    setTimeout(() => { layer.innerHTML = ''; layer.classList.remove('is-on'); }, 200);
  };
}
let toastTimer = null;
function toast(msg) {
  let t = phone.querySelector('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; phone.appendChild(t); }
  t.textContent = msg;
  requestAnimationFrame(() => t.classList.add('is-on'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('is-on'), 2200);
}
function busy(text, ms, done) {
  const el = document.createElement('div');
  el.className = 'loading';
  el.innerHTML = '<div class="spin"></div><p>' + text + '</p>';
  phone.appendChild(el);
  requestAnimationFrame(() => el.classList.add('is-on'));
  setTimeout(() => {
    el.classList.remove('is-on');
    setTimeout(() => el.remove(), 220);
    done();
  }, ms);
}

/* ============================================================
   7. 动作
   ============================================================ */
function goTab(tab) {
  state.tab = tab;
  state.stack = [];
  render();
}

function push(entry) {
  state.stack.push(entry);
  render('push');
}
function back() {
  if (state.stack.length) {
    state.stack.pop();
    render('pop');
  }
}

function openApply(scene) {
  state.form = newForm(scene);
  state.demo = 'progress';
  push({ k: 'apply' });
}

function submitApply() {
  const f = state.form;
  const mark = (k, on) => {
    const e = viewport.querySelector('[data-err="' + k + '"]');
    if (e) e.hidden = !on;
    if (k === 'scene') {
      viewport.querySelectorAll('[data-field="scene"] .scene').forEach(s => s.classList.toggle('is-err', on));
    }
  };
  let err = null;
  if (!f.scene) err = ['scene', '请选择请假场景'];
  else if (!f.type) err = [null, '请选择请假类型'];
  else if (f.end - f.start < 600000) err = ['time', '结束时间需晚于开始时间至少 10 分钟'];
  else if (f.reason.trim().length < 5) err = ['reason', '请填写请假理由（不少于 5 个字）'];

  ['scene', 'time', 'reason'].forEach(k => mark(k, false));
  if (err) {
    if (err[0]) { mark(err[0], true); const n = viewport.querySelector('[data-field="' + err[0] + '"]'); if (n) n.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    toast(err[1]);
    return;
  }

  const seq = state.apps.length + 1;
  const id = 'CL' + state.now.getFullYear() + pad(state.now.getMonth() + 1) + pad(state.now.getDate()) +
    String(seq).padStart(3, '0');
  const app = {
    id: id, scene: f.scene, type: f.type, start: f.start, end: f.end,
    status: 'PENDING', submittedAt: new Date(state.now),
    reason: f.reason.trim(), dest: f.scene === 'OFF' ? (f.dest || '—') : '—',
    phone: f.phone, materials: f.materials
  };
  busy('正在提交', 800, () => {
    state.apps.unshift(app);
    state.stack = [{ k: 'detail', id: id, fromApply: true }];
    state.heroId = id;
    render('push');
    toast('已提交，等待辅导员审批');
  });
}

function doCheckout(a) {
  const isOff = a.scene === 'OFF';
  dialog({
    title: isOff ? '返校定位并销假' : '确认结束本次请假',
    desc: isOff ? '将校验你当前是否在校区范围内，通过后完成销假。' : '确认后本次请假立即结束，不可撤销。',
    ok: isOff ? '开始校验' : '确认结束',
    onOk() {
      if (isOff) {
        busy('正在校验定位…', 1300, () => {
          a.status = 'COMPLETED';
          a.completedAt = new Date(state.now);
          state.demo = 'auto'; state.heroId = null;
          render();
          toast('定位校验通过，已销假');
        });
      } else {
        a.status = 'COMPLETED';
        a.completedAt = new Date(state.now);
        state.demo = 'auto'; state.heroId = null;
        render();
        toast('已确认结束');
      }
    }
  });
}
function doWithdraw(a) {
  dialog({
    title: '撤回申请', desc: '撤回后需重新提交申请。', ok: '撤回', danger: true,
    onOk() {
      a.status = 'WITHDRAWN';
      state.demo = 'auto'; state.heroId = null;
      render();
      toast('已撤回申请');
    }
  });
}
function doCancel(a) {
  dialog({
    title: '取消申请', desc: '取消后该请假不会生效。', ok: '确认取消', danger: true,
    onOk() {
      a.status = 'CANCELLED';
      state.demo = 'auto'; state.heroId = null;
      render();
      toast('已取消');
    }
  });
}

/* 时间选择 */
function openTimePicker(field) {
  const f = state.form;
  const cur = f[field];
  const quick = field === 'start'
    ? [{ v: 0, t: '现在' }, { v: 60, t: '1 小时后' }, { v: 'today20', t: '今天 20:00' }, { v: 'tom8', t: '明天 08:00' }]
    : [{ v: 120, t: '2 小时后' }, { v: 'today20', t: '今天 20:00' }, { v: 'tom12', t: '明天 12:00' }, { v: 'tom18', t: '明天 18:00' }];

  const inner =
    '<div class="quick">' + quick.map((q, i) => '<button data-q="' + q.v + '">' + q.t + '</button>').join('') + '</div>' +
    '<div class="dtgrid"><label><span>日期</span><input type="date" id="pDate" value="' + dateVal(cur) + '"></label>' +
    '<label><span>时间</span><input type="time" id="pTime" value="' + hm(cur) + '"></label></div>' +
    '<p style="margin-top:12px;font-size:12px;line-height:18px;color:var(--ink-3)">' +
    (field === 'start' ? '开始时间最早为当前时间。' : '结束时间需晚于开始时间 10 分钟以上。') + '</p>';

  openSheet(field === 'start' ? '选择开始时间' : '选择结束时间', inner, () => {
    const d = document.getElementById('pDate').value, t = document.getElementById('pTime').value;
    if (!d || !t) { toast('请选择日期与时间'); return false; }
    const v = new Date(d + 'T' + t);
    if (isNaN(v)) { toast('时间格式不正确'); return false; }
    f[field] = v;
    if (field === 'start' && f.end - f.start < 600000) f.end = new Date(v.getTime() + 4 * 3600000);
    f.dirty = true;
    render();
    return true;
  });

  layer.querySelectorAll('[data-q]').forEach(b => {
    b.onclick = () => {
      const v = b.dataset.q;
      let nd;
      if (v === 'today20') nd = dt(state.now.getMonth() + 1, state.now.getDate(), 20, 0);
      else if (v === 'tom8') nd = new Date(dt(state.now.getMonth() + 1, state.now.getDate(), 8, 0).getTime() + 86400000);
      else if (v === 'tom12') nd = new Date(dt(state.now.getMonth() + 1, state.now.getDate(), 12, 0).getTime() + 86400000);
      else if (v === 'tom18') nd = new Date(dt(state.now.getMonth() + 1, state.now.getDate(), 18, 0).getTime() + 86400000);
      else nd = new Date(state.now.getTime() + Number(v) * 60000);
      layer.querySelectorAll('[data-q]').forEach(x => x.classList.remove('is-on'));
      b.classList.add('is-on');
      document.getElementById('pDate').value = dateVal(nd);
      document.getElementById('pTime').value = hm(nd);
    };
  });
}
function dateVal(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

/* ============================================================
   8. 事件
   ============================================================ */
phone.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (tab) { goTab(tab.dataset.tab); return; }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  const a = id ? byId(id) : null;
  const top = state.stack[state.stack.length - 1];

  switch (act) {
    case 'go-records': goTab('records'); break;
    case 'go-messages': goTab('messages'); break;
    case 'back':
      if (top && top.fromApply) { state.stack = []; state.tab = 'home'; render('pop'); }
      else back();
      break;
    case 'open': push({ k: 'detail', id: id }); break;
    case 'apply': openApply(el.dataset.scene); break;
    case 'filter': state.filter = el.dataset.f; render(); break;
    case 'read-all':
      state.messages.forEach(m => m.unread = false);
      render(); toast('已全部标为已读');
      break;
    case 'scene':
      state.form.scene = el.dataset.v;
      state.form.dirty = true;
      render();
      break;
    case 'type':
      state.form.type = el.dataset.v;
      state.form.dirty = true;
      render();
      break;
    case 'pick': openTimePicker(el.dataset.f); break;
    case 'upload':
      state.form.materials = Math.min(3, state.form.materials + 1);
      render(); toast('已添加 1 张（演示）');
      break;
    case 'submit': submitApply(); break;
    case 'checkout': doCheckout(a); break;
    case 'withdraw': doWithdraw(a); break;
    case 'cancel': doCancel(a); break;
    case 'extend': toast('续假需重新审批，本版未展开'); break;
  }
});

phone.addEventListener('input', e => {
  const k = e.target.dataset.in;
  if (!k || !state.form) return;
  state.form[k] = e.target.value;
  if (k === 'reason') {
    const c = phone.querySelector('[data-count]');
    if (c) c.textContent = e.target.value.length;
  }
  if (k === 'dest' || k === 'phone' || k === 'reason') {
    const err = viewport.querySelector('[data-err="reason"]');
    if (k === 'reason' && err && e.target.value.trim().length >= 5) err.hidden = true;
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (layerCloser) closeLayer();
    else if (state.stack.length) {
      const top = state.stack[state.stack.length - 1];
      if (top.fromApply) { state.stack = []; state.tab = 'home'; render('pop'); }
      else back();
    }
  }
});

/* ============================================================
   9. 演示控制 / 适配
   ============================================================ */
document.querySelectorAll('[data-demo]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('[data-demo]').forEach(x => x.classList.remove('is-on'));
    b.classList.add('is-on');
    state.demo = b.dataset.demo;
    state.heroId = null;
    state.tab = 'home';
    state.stack = [];
    if (state.demo === 'pending') state.heroId = 'CL20261019002';
    if (state.demo === 'overdue') state.now = dt(10, 19, 21, 10);
    if (state.demo !== 'overdue') state.now = dt(10, 19, 14, 30);
    render();
  });
});

const swTick = document.getElementById('swTick');
swTick.classList.add('is-on');
swTick.addEventListener('click', () => {
  state.tick = !state.tick;
  swTick.classList.toggle('is-on', state.tick);
});

/* 时钟 + 倒计时 */
const clock = document.getElementById('clock');
setInterval(() => {
  clock.textContent = hm(new Date());
  if (!state.tick) return;
  if (state.stack.length) return;
  const a = heroApp();
  if (!a) return;
  const ds = displayStatus(a);
  if (ds !== 'IN_PROGRESS' && ds !== 'OVERDUE') return;
  state.now = new Date(state.now.getTime() + 1000);
  const host = viewport.querySelector('.slip__hero');
  if (!host) return;
  const ms = ds === 'IN_PROGRESS' ? a.end - state.now : state.now - a.end;
  const ps = parts(ms);
  const nums = host.querySelectorAll('[data-n]');
  const units = host.querySelectorAll('.u');
  ps.forEach((p, i) => {
    if (nums[i]) nums[i].textContent = p.n;
    if (units[i]) units[i].textContent = p.u;
  });
  const lab = viewport.querySelector('.tracklabs span:first-child');
  if (lab && ds === 'IN_PROGRESS') lab.textContent = '已过 ' + partsText(state.now - a.start);
}, 1000);

/* 缩放适配：1366×768 等矮屏整体缩小，不裁切 */
const device = document.getElementById('device');
function fit() {
  if (innerWidth <= 520) { device.style.transform = ''; return; }
  const s = Math.min(1, (innerHeight - 32) / 812, (innerWidth - 300) / 375);
  device.style.transform = 'scale(' + s.toFixed(4) + ')';
}
addEventListener('resize', fit);
fit();

render();
})();
</script>
