<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>首页版式框架 · 通栏色带版</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  body{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#E9EDF2;padding:32px 16px;
    font-family:"PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    color:#121A26;
  }
  :root{
    --brand:#2563C9; --brand-deep:#194089; --tint:#EEF3FB;
    --bg:#F5F7FA; --ink:#121A26; --ink2:#5A6577; --ink3:#78849A;
    --line:#E2E7EF; --rail:#D2DEEF;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}

  /* 手机壳 */
  .phone{
    position:relative;width:375px;height:812px;background:var(--bg);
    border-radius:38px;overflow:hidden;
    display:flex;flex-direction:column;padding-bottom:50px;
    box-shadow:0 24px 56px -24px rgba(18,26,38,.34),0 0 0 1px rgba(18,26,38,.06);
  }
  .spacer{flex:1 1 auto;min-height:28px;}

  /* 状态栏 */
  .statusbar{
    height:44px;display:flex;align-items:center;justify-content:space-between;
    padding:0 26px 0 22px;font-size:12px;font-weight:600;
  }
  .sb-icons{display:flex;align-items:center;gap:5px;}
  .bars{display:flex;align-items:flex-end;gap:2px;height:11px;}
  .bars i{width:3px;border-radius:.8px;background:var(--ink);}
  .bars i:nth-child(1){height:4.5px}.bars i:nth-child(2){height:6.5px}
  .bars i:nth-child(3){height:9px}.bars i:nth-child(4){height:11.5px}

  /* 导航 */
  .nav{position:relative;height:44px;display:flex;align-items:center;justify-content:center;}
  .nav h1{font-size:17px;line-height:24px;font-weight:600;letter-spacing:.01em;}
  .nav .bell{
    position:absolute;right:14px;top:6px;width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;position:absolute;
  }
  .nav .bell svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.7;
                 stroke-linecap:round;stroke-linejoin:round;}
  .nav .bell i{position:absolute;right:6px;top:5px;width:6px;height:6px;border-radius:50%;
               background:#C0281E;box-shadow:0 0 0 1.5px var(--bg);}

  /* ===== 通栏色带 ===== */
  .band{
    background:var(--tint);
    padding:18px 20px 22px;
    margin-top:2px;
  }
  .band__meta{display:flex;align-items:center;justify-content:space-between;
              font-size:11px;line-height:16px;color:var(--ink2);letter-spacing:.02em;}
  .band__meta span:last-child{color:var(--ink3);}

  .band__state{
    margin-top:12px;font-size:12px;line-height:18px;font-weight:600;
    color:var(--brand-deep);letter-spacing:2px;
  }
  .band__big{
    margin-top:6px;font-size:58px;line-height:66px;font-weight:600;
    letter-spacing:-1.5px;color:var(--brand);
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  }
  .band__unit{
    margin-top:2px;font-size:10px;line-height:14px;font-weight:500;
    color:var(--ink3);letter-spacing:4px;
  }
  .band__range{
    margin-top:16px;font-size:12px;line-height:18px;color:var(--ink2);
    font-variant-numeric:tabular-nums;letter-spacing:.02em;
  }
  .band__range em{font-style:normal;color:#A9B2C2;margin:0 4px;}

  .track{position:relative;height:3px;border-radius:2px;background:var(--rail);margin-top:14px;}
  .track i{position:absolute;left:0;top:0;height:3px;width:60%;border-radius:2px;background:var(--brand);}
  .track b{
    position:absolute;left:60%;top:50%;width:7px;height:7px;border-radius:50%;
    background:var(--brand);transform:translate(-50%,-50%);
    box-shadow:0 0 0 3px rgba(37,99,201,.12);
  }
  .track__labs{display:flex;justify-content:space-between;margin-top:8px;
               font-size:10px;line-height:14px;color:var(--ink3);
               font-variant-numeric:tabular-nums;}

  /* ===== 两列信息条 ===== */
  .facts{
    margin:20px 20px 0;padding:14px 0 16px;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    display:grid;grid-template-columns:1fr 1fr;gap:0;
  }
  .fact{padding-right:12px;}
  .fact+.fact{padding-left:16px;border-left:1px solid var(--line);}
  .fact span{display:block;font-size:11px;line-height:16px;color:var(--ink3);letter-spacing:.04em;}
  .fact b{display:block;margin-top:5px;font-size:14px;line-height:22px;font-weight:600;
          font-variant-numeric:tabular-nums;}

  /* ===== 操作 ===== */
  .cta{
    display:block;width:calc(100% - 40px);margin:20px 20px 0;height:54px;border:0;border-radius:8px;
    background:var(--brand);color:#fff;font-family:inherit;font-size:15px;font-weight:500;
    letter-spacing:1px;cursor:pointer;
  }
  .cta:active{background:#1F55AD;}
  .sub-link{display:block;margin:10px auto 0;background:none;border:0;
            font-family:inherit;font-size:13px;line-height:20px;color:var(--brand);font-weight:500;cursor:pointer;}

  /* ===== 最近记录 ===== */
  .sec{margin:30px 20px 0;font-size:15px;line-height:22px;font-weight:600;letter-spacing:.02em;}
  .recent{
    margin:10px 20px 0;height:64px;background:#fff;border-radius:12px;
    display:flex;align-items:center;justify-content:space-between;padding:0 16px;
    border:1px solid #EDF0F5;
  }
  .recent span{font-size:13px;line-height:20px;color:var(--ink);letter-spacing:.02em;}
  .recent:last-of-type{margin-bottom:20px;}
  .recent svg{width:16px;height:16px;fill:none;stroke:#B9C2D0;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* ===== tabbar ===== */
  .tabbar{
    position:absolute;left:0;right:0;bottom:0;height:50px;
    display:flex;align-items:center;justify-content:space-around;
    background:#fff;border-top:1px solid var(--line);
  }
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;
       font-size:10px;line-height:12px;color:var(--ink3);letter-spacing:.02em;}
  .tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;
           stroke-linecap:round;stroke-linejoin:round;}
  .tab.on{color:var(--brand);}

  .caption{font-size:12px;line-height:18px;color:#6B7688;text-align:center;}
</style>
</head>
<body>

<div class="phone">

  <div class="statusbar">
    <span class="num">9:41</span>
    <span class="sb-icons">
      <span class="bars"><i></i><i></i><i></i><i></i></span>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none">
        <path d="M1 3.6a8.6 8.6 0 0 1 13 0" stroke="#121A26" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M3.4 6.2a5.4 5.4 0 0 1 8.2 0" stroke="#121A26" stroke-width="1.3" stroke-linecap="round"/>
        <circle cx="7.5" cy="8.9" r="1.1" fill="#121A26"/>
      </svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none">
        <rect x="0.5" y="0.9" width="20" height="9.2" rx="2.4" stroke="#121A26" stroke-opacity=".4"/>
        <rect x="2" y="2.4" width="15" height="6.2" rx="1.2" fill="#121A26"/>
        <path d="M22.4 3.6v3.8" stroke="#121A26" stroke-opacity=".45" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </span>
  </div>

  <div class="nav">
    <h1>校园请假</h1>
    <div class="bell">
      <svg viewBox="0 0 24 24"><path d="M12 3.6a5.6 5.6 0 0 0-5.6 5.6v3.6L4.8 16h14.4l-1.6-3.2V9.2A5.6 5.6 0 0 0 12 3.6z"/><path d="M9.8 19.4a2.4 2.4 0 0 0 4.4 0"/></svg>
      <i></i>
    </div>
  </div>

  <!-- 通栏色带 -->
  <section class="band">
    <div class="band__meta">
      <span>10月20日 周二</span>
      <span>计算机2201班</span>
    </div>

    <div class="band__state">请假中 · 离校 · 事假</div>
    <div class="band__big num">05:29</div>
    <div class="band__unit">小 时 : 分</div>

    <div class="band__range">10.19 08:00<em>—</em>10.19 20:00</div>

    <div class="track"><i></i><b></b></div>
    <div class="track__labs"><span>08:00</span><span>20:00</span></div>
  </section>

  <!-- 两列信息条 -->
  <section class="facts">
    <div class="fact"><span>审批</span><b>李老师 · 10.18 20:15</b></div>
    <div class="fact"><span>销假</span><b>返校定位</b></div>
  </section>

  <button class="cta">返校定位并销假</button>
  <button class="sub-link">申请续假</button>

  <div class="sec">最近记录</div>
  <div class="recent">
    <span>10.09 · 病假 · 已销假</span>
    <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
  </div>
  <div class="recent">
    <span>10.02 · 离校 · 事假 · 已销假</span>
    <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
  </div>

  <nav class="tabbar">
    <div class="tab on">
      <svg viewBox="0 0 24 24"><path d="M3.6 10.6 12 3.8l8.4 6.8V20a.9.9 0 0 1-.9.9h-4.7v-5.8H9.2v5.8H4.5a.9.9 0 0 1-.9-.9z"/></svg>
      <span>首页</span>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24"><path d="M6 3.8h9l4.2 4.2V20a.9.9 0 0 1-.9.9H6a.9.9 0 0 1-.9-.9V4.7a.9.9 0 0 1 .9-.9z"/><path d="M14.8 4v4.2H19M8.6 12.4h7M8.6 16.2h4.6"/></svg>
      <span>记录</span>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24"><path d="M12 3.6a5.6 5.6 0 0 0-5.6 5.6v3.6L4.8 16h14.4l-1.6-3.2V9.2A5.6 5.6 0 0 0 12 3.6z"/><path d="M9.8 19.4a2.4 2.4 0 0 0 4.4 0"/></svg>
      <span>消息</span>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8.2" r="3.8"/><path d="M4.8 20.4v-.8a7.2 7.2 0 0 1 14.4 0v.8"/></svg>
      <span>我的</span>
    </div>
  </nav>

</div>

<p class="caption">首页版式框架 · 通栏色带 / 两列信息条 / 单卡</p>

</body>
</html>
