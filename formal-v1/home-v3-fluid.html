<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>首页 · 流体版</title>
<!--
  流体版：版式沿用 home-v2（通栏色带 / 两列信息条 / 单页卡片），
  只加强三件事：材质与层级、光学字号、弹簧与手势。
  弹簧参数取自 Apple 官方交互表：
    通用 UI      damping 1.0 / response 0.40
    Sheet（抽屉）damping 0.8 / response 0.30
  手势释放按 project(v, 0.998) 投射，取吸附点。
  小程序落地限制：backdrop-filter 不支持 → 已给 @supports 回退纯色。
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  :root{
    --brand:#2563C9; --brand-deep:#194089; --brand-press:#1F55AD; --tint:#EEF3FB;
    --bg:#F5F7FA; --surface:#fff;
    --ink:#121A26; --ink2:#5A6577; --ink3:#78849A; --ink4:#A9B2C2;
    --line:#E2E7EF; --line-weak:#EDF0F5; --rail:#D2DEEF;
    --shadow-card:0 1px 2px rgba(18,26,38,.04), 0 8px 24px -20px rgba(18,26,38,.35);
    --shadow-cta:0 8px 20px -6px rgba(37,99,201,.34);
    --shadow-sheet:0 -18px 48px -24px rgba(18,26,38,.4);
    --sp-dur:.34s;
  }
  button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#E9EDF2;padding:32px 16px;
    font-family:"PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    color:var(--ink);overflow:hidden;
  }

  .phone{
    position:relative;width:375px;height:812px;background:var(--bg);
    border-radius:38px;overflow:hidden;display:flex;flex-direction:column;padding-bottom:50px;
    box-shadow:0 24px 56px -24px rgba(18,26,38,.34),0 0 0 1px rgba(18,26,38,.06);
  }

  /* ===== 状态栏 ===== */
  .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;
             padding:0 26px 0 22px;font-size:12px;font-weight:600;letter-spacing:.01em;}
  .sb-icons{display:flex;align-items:center;gap:5px;}
  .bars{display:flex;align-items:flex-end;gap:2px;height:11px;}
  .bars i{width:3px;border-radius:.8px;background:var(--ink);}
  .bars i:nth-child(1){height:4.5px}.bars i:nth-child(2){height:6.5px}
  .bars i:nth-child(3){height:9px}.bars i:nth-child(4){height:11.5px}

  /* ===== 导航 ===== */
  .nav{position:relative;height:44px;display:flex;align-items:center;justify-content:center;}
  .nav h1{font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.2px;}
  .nav .bell{position:absolute;right:10px;top:4px;width:36px;height:36px;border-radius:50%;
             display:flex;align-items:center;justify-content:center;}
  .nav .bell svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.7;
                 stroke-linecap:round;stroke-linejoin:round;}
  .nav .bell i{position:absolute;right:7px;top:6px;width:6px;height:6px;border-radius:50%;
               background:#C0281E;box-shadow:0 0 0 1.5px var(--bg);}

  /* ===== 色带 ===== */
  .band{background:var(--tint);padding:18px 20px 22px;margin-top:2px;}
  .band__meta{display:flex;align-items:center;justify-content:space-between;
              font-size:11px;line-height:16px;color:var(--ink2);letter-spacing:.06em;}
  .band__meta span:last-child{color:var(--ink3);letter-spacing:.02em;}
  .band__state{margin-top:12px;font-size:12px;line-height:18px;font-weight:600;
               color:var(--brand-deep);letter-spacing:2.2px;}
  .band__big{
    margin-top:6px;height:66px;display:flex;align-items:baseline;
    font-size:58px;line-height:66px;font-weight:600;letter-spacing:-2.4px;
    color:var(--brand);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  }
  .band__big .d{display:inline-block;min-width:.62em;text-align:center;will-change:transform,opacity;}
  .band__big .c{display:inline-block;width:.42em;text-align:center;opacity:.9;}
  .band__unit{margin-top:2px;font-size:10px;line-height:14px;font-weight:500;
              color:var(--ink3);letter-spacing:4px;}
  .band__range{margin-top:16px;font-size:12px;line-height:18px;color:var(--ink2);
               font-variant-numeric:tabular-nums;letter-spacing:.02em;}
  .band__range em{font-style:normal;color:var(--ink4);margin:0 4px;}

  .track{position:relative;height:3px;border-radius:2px;background:var(--rail);
         margin-top:16px;overflow:visible;}
  .track i{position:absolute;left:0;top:0;height:3px;width:100%;border-radius:2px;
           background:var(--brand);transform:scaleX(0);transform-origin:left;}
  .track b{position:absolute;left:0;top:50%;width:7px;height:7px;border-radius:50%;
           background:var(--brand);transform:translate(-50%,-50%);
           box-shadow:0 0 0 3px rgba(37,99,201,.12);}
  .track__labs{display:flex;justify-content:space-between;margin-top:8px;
               font-size:10px;line-height:14px;color:var(--ink3);
               font-variant-numeric:tabular-nums;letter-spacing:.02em;}

  /* ===== 两列信息条 ===== */
  .facts{
    margin:20px 20px 0;padding:14px 0 16px;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    display:grid;grid-template-columns:1fr 1fr;
  }
  .fact{padding-right:12px;}
  .fact+.fact{padding-left:16px;border-left:1px solid var(--line);}
  .fact span{display:block;font-size:11px;line-height:16px;color:var(--ink3);letter-spacing:.06em;}
  .fact b{display:block;margin-top:5px;font-size:14px;line-height:22px;font-weight:600;
          font-variant-numeric:tabular-nums;letter-spacing:-.1px;}

  /* ===== 操作 ===== */
  .cta{
    display:block;width:calc(100% - 40px);margin:20px 20px 0;height:54px;border:0;border-radius:12px;
    background:var(--brand);color:#fff;font-family:inherit;font-size:15px;font-weight:500;
    letter-spacing:.6px;cursor:pointer;box-shadow:var(--shadow-cta);
    transition:transform .32s cubic-bezier(.2,.9,.25,1),background .18s,box-shadow .32s;
    will-change:transform;
  }
  .cta.is-press{transform:scale(.965);background:var(--brand-press);
                box-shadow:0 4px 12px -6px rgba(37,99,201,.4);transition-duration:.12s;}
  .sub-link{display:block;margin:12px auto 0;padding:8px 14px;background:none;border:0;
            font-family:inherit;font-size:13px;line-height:20px;color:var(--brand);font-weight:500;
            cursor:pointer;transition:opacity .18s,transform .32s cubic-bezier(.2,.9,.25,1);}
  .sub-link.is-press{opacity:.55;transform:scale(.97);transition-duration:.1s;}

  /* ===== 最近记录 ===== */
  .sec{margin:30px 20px 0;font-size:15px;line-height:22px;font-weight:600;letter-spacing:-.1px;}
  .recent{
    margin:10px 20px 0;height:64px;background:var(--surface);border-radius:14px;
    display:flex;align-items:center;justify-content:space-between;padding:0 16px;
    border:1px solid var(--line-weak);box-shadow:var(--shadow-card);
    transition:transform .34s cubic-bezier(.2,.9,.25,1),box-shadow .34s;
    will-change:transform;
  }
  .recent.is-press{transform:scale(.984);box-shadow:0 1px 2px rgba(18,26,38,.05);transition-duration:.12s;}
  .recent span{font-size:13px;line-height:20px;color:var(--ink);letter-spacing:.01em;}
  .recent svg{width:16px;height:16px;fill:none;stroke:#B9C2D0;stroke-width:2;
              stroke-linecap:round;stroke-linejoin:round;}
  .recent:last-of-type{margin-bottom:20px;}

  /* ===== tabBar：材质 ===== */
  .tabbar{
    position:absolute;left:0;right:0;bottom:0;height:50px;
    display:flex;align-items:center;justify-content:space-around;
    background:rgba(255,255,255,.78);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    backdrop-filter:blur(20px) saturate(180%);
    box-shadow:0 -1px 0 rgba(18,26,38,.06), 0 -12px 24px -20px rgba(18,26,38,.4);
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .tabbar{background:#fff;}
  }
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;
       font-size:10px;line-height:12px;color:var(--ink3);letter-spacing:.03em;
       transition:color .2s,transform .34s cubic-bezier(.2,.9,.25,1);}
  .tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;
           stroke-linecap:round;stroke-linejoin:round;}
  .tab.on{color:var(--brand);}
  .tab.is-press{transform:scale(.92);transition-duration:.12s;}

  /* ===== 抽屉 ===== */
  .scrim{position:absolute;inset:0;background:rgba(18,26,38,.34);opacity:0;pointer-events:none;}
  .scrim.is-on{pointer-events:auto;}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;background:#fff;
    border-radius:20px 20px 0 0;padding:8px 20px 22px;
    box-shadow:var(--shadow-sheet);will-change:transform;
    touch-action:none;
  }
  .grab{width:36px;height:5px;border-radius:3px;background:#D8DEE8;margin:2px auto 14px;}
  .sheet h3{font-size:19px;line-height:26px;font-weight:600;letter-spacing:-.3px;}
  .sheet p{margin-top:8px;font-size:13px;line-height:21px;color:var(--ink2);}
  .sheet .pill-row{display:flex;gap:10px;margin-top:16px;}
  .sheet .pill{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;}
  .sheet .pill span{display:block;font-size:11px;line-height:16px;color:var(--ink3);letter-spacing:.04em;}
  .sheet .pill b{display:block;margin-top:4px;font-size:14px;line-height:22px;font-weight:600;
                 font-variant-numeric:tabular-nums;}
  .sheet .pill.is-on{border-color:var(--brand);background:var(--tint);}
  .sheet .pill.is-on b{color:var(--brand-deep);}
  .sheet .cta{margin:18px 0 0;width:100%;}

  .caption{font-size:12px;line-height:18px;color:#6B7688;text-align:center;}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }
</style>
</head>
<body>

<div class="phone" id="phone">

  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-icons">
      <span class="bars"><i></i><i></i><i></i><i></i></span>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none">
        <path d="M1 3.6a8.6 8.6 0 0 1 13 0" stroke="#121A26" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M3.4 6.2a5.4 5.4 0 0 1 8.2 0" stroke="#121A26" stroke-width="1.3" stroke-linecap="round"/>
        <circle cx="7.5" cy="8.9" r="1.1" fill="#121A26"/>
      </svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none">
        <rect x="0.5" y="0.9" width="20" height="9.2" rx="2.4" stroke="#121A26" stroke-opacity=".4"/>
        <rect x="2" y="2.4" width="15" height="6.2" rx="1.2" fill="#121A26"/>
        <path d="M22.4 3.6v3.8" stroke="#121A26" stroke-opacity=".45" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </span>
  </div>

  <div class="nav">
    <h1>校园请假</h1>
    <button class="bell pressable" aria-label="消息">
      <svg viewBox="0 0 24 24"><path d="M12 3.6a5.6 5.6 0 0 0-5.6 5.6v3.6L4.8 16h14.4l-1.6-3.2V9.2A5.6 5.6 0 0 0 12 3.6z"/><path d="M9.8 19.4a2.4 2.4 0 0 0 4.4 0"/></svg>
      <i></i>
    </button>
  </div>

  <section class="band">
    <div class="band__meta">
      <span>10月20日 周二</span>
      <span>计算机2201班</span>
    </div>
    <div class="band__state">请假中 · 离校 · 事假</div>
    <div class="band__big" id="clock" aria-live="off"></div>
    <div class="band__unit">小 时 : 分</div>
    <div class="band__range">10.19 08:00<em>—</em>10.19 20:00</div>

  </section>

  <button class="cta" id="cta">返校定位并销假</button>
  <button class="sub-link pressable">申请续假</button>

  <div class="sec">最近记录</div>
  <div class="recent pressable"><span>10.09 · 病假 · 已销假</span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
  <div class="recent pressable"><span>10.02 · 离校 · 事假 · 已销假</span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>

  <nav class="tabbar">
    <div class="tab on pressable">
      <svg viewBox="0 0 24 24"><path d="M3.6 10.6 12 3.8l8.4 6.8V20a.9.9 0 0 1-.9.9h-4.7v-5.8H9.2v5.8H4.5a.9.9 0 0 1-.9-.9z"/></svg>
      <span>首页</span>

    <div class="tab pressable">
      <svg viewBox="0 0 24 24"><path d="M6 3.8h9l4.2 4.2V20a.9.9 0 0 1-.9.9H6a.9.9 0 0 1-.9-.9V4.7a.9.9 0 0 1 .9-.9z"/><path d="M14.8 4v4.2H19M8.6 12.4h7M8.6 16.2h4.6"/></svg>
      <span>记录</span>
    </div>
    <div class="tab pressable">
      <svg viewBox="0 0 24 24"><path d="M12 3.6a5.6 5.6 0 0 0-5.6 5.6v3.6L4.8 16h14.4l-1.6-3.2V9.2A5.6 5.6 0 0 0 12 3.6z"/><path d="M9.8 19.4a2.4 2.4 0 0 0 4.4 0"/></svg>
      <span>消息</span>
    </div>
    <div class="tab pressable">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8.2" r="3.8"/><path d="M4.8 20.4v-.8a7.2 7.2 0 0 1 14.4 0v.8"/></svg>
      <span>我的</span>
    </div>
  </nav>

  <!-- 抽屉 -->
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="返校定位并销假" hidden>
    <div class="grab" id="grab"></div>
    <h3>返校定位并销假</h3>
    <p>将校验你当前是否在校区范围内，通过后本次请假立即结束。</p>
    <div class="pill-row">
      <div class="pill is-on"><span>校验方式</span><b>校区范围定位</b></div>
      <div class="pill"><span>预计耗时</span><b>约 3 秒</b></div>
    </div>
    <button class="cta" id="confirm">开始校验</button>
  </div>

</div>

<p class="caption">流体版 · 可下拉关闭的抽屉 / 数字滚动 / 弹簧按压</p>

<script>
(function(){
  'use strict';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 弹簧：k=(2π/response)², c=2ζω ---------- */
  function spring(o){
    const omega = 2*Math.PI/(o.response||0.4);
    const k = omega*omega, c = 2*(o.damping==null?1:o.damping)*omega;
    let x = o.from;
    let v = Math.max(-8000, Math.min(8000, o.velocity||0));
    let last = performance.now(), raf;
    function tick(now){
      const dt = Math.min(0.064,(now-last)/1000); last = now;
      const a = -k*(x-o.to) - c*v;
      v += a*dt; x += v*dt;
      o.onUpdate(x);
      if (Math.abs(x-o.to) < 0.2 && Math.abs(v) < 1.5){ o.onUpdate(o.to); o.onDone && o.onDone(); return; }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    return {
      stop(){ cancelAnimationFrame(raf); return {pos:x, vel:v}; },
      pos(){ return x; }
    };
  }

  /* ---------- 倒计时：逐位滚动 ---------- */
  const START_SEC = 5*3600 + 29*60;   // 05:29
  let left = START_SEC;
  const clockEl = document.getElementById('clock');
  const digits = [];
  function buildClock(){
    clockEl.innerHTML = '';
    digits.length = 0;
    const s = fmt(left);
    for (let i=0;i<s.length;i++){
      if (s[i] === ':'){ const c=document.createElement('span'); c.className='c'; c.textContent=':'; clockEl.appendChild(c); }
      else { const d=document.createElement('span'); d.className='d'; d.textContent=s[i]; clockEl.appendChild(d); digits.push({el:d, idx:i}); }
    }
  }
  function fmt(sec){
    sec = Math.max(0, sec);
    const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60);
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  }
  function roll(el, ch){
    if (el.textContent === ch) return;
    if (reduce){ el.textContent = ch; return; }
    el.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-46%)',opacity:0}],
      {duration:110,easing:'cubic-bezier(.4,0,1,1)'}).onfinish = () => {
        el.textContent = ch;
        el.animate([{transform:'translateY(46%)',opacity:0},{transform:'translateY(0)',opacity:1}],
          {duration:220,easing:'cubic-bezier(.2,0,0,1)'});
      };
  }
  function tickClock(){
    const s = fmt(left).replace(':','');
    digits.forEach((d,i) => roll(d.el, s[i]));
  }
  buildClock();
  setInterval(() => { if (left>0){ left--; tickClock(); } }, 1000);

  /* ---------- 进度条：弹簧生长 ---------- */
  const PCT = 0.60;
  const fill = document.getElementById('trackFill'), dot = document.getElementById('trackDot');
  requestAnimationFrame(() => {
    if (reduce){ fill.style.transform = 'scaleX('+PCT+')'; dot.style.left = (PCT*100)+'%'; return; }
    spring({from:0,to:PCT,damping:1,response:0.7,
      onUpdate(v){ fill.style.transform='scaleX('+v+')'; dot.style.left=(v*100)+'%'; }});
  });

  /* ---------- 按压反馈：按下即响应 ---------- */
  document.querySelectorAll('.pressable').forEach(el => {
    const on = e => { el.classList.add('is-press'); el.setPointerCapture && e.pointerId!=null && el.setPointerCapture(e.pointerId); };
    const off = () => el.classList.remove('is-press');
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
  });
  const cta = document.getElementById('cta');
  cta.addEventListener('pointerdown', () => cta.classList.add('is-press'));
  ['pointerup','pointercancel','pointerleave'].forEach(t => cta.addEventListener(t, () => cta.classList.remove('is-press')));

  /* ---------- 抽屉：跟手 / 橡胶边界 / 动量吸附 ---------- */
  const sheet = document.getElementById('sheet');
  const scrim = document.getElementById('scrim');
  let H = 300;                // 抽屉高度，开启时测量后覆盖
  let cur = H, anim = null, dragging = false, startY = 0, startCur = 0;
  let lastY = 0, lastT = 0, lastV = 0;

  function place(y){ cur = y; sheet.style.transform = 'translate3d(0,'+y+'px,0)';
                     scrim.style.opacity = String(Math.max(0, 1 - y/H)); }

  function open(){
    sheet.hidden = false;
    const h = sheet.getBoundingClientRect().height || H;
    H = h;
    if (anim) anim.stop();
    cur = H; place(H);
    requestAnimationFrame(() => {
      anim = reduce ? (place(0), null)
        : spring({from:cur, to:0, damping:0.8, response:0.3, onUpdate:place});
    });
    scrim.classList.add('is-on');
  }
  function close(fromY, vel){
    if (anim) anim.stop();
    const y0 = fromY == null ? cur : fromY;
    if (reduce){ place(H); sheet.hidden = true; scrim.classList.remove('is-on'); cur = H; return; }
    anim = spring({from:y0, to:H, velocity:vel||0, damping:0.9, response:0.3, onUpdate:place,
      onDone(){ sheet.hidden = true; scrim.classList.remove('is-on'); cur = H; }});
  }

  function project(v, decel){
    decel = decel || 0.998;
    const d = (v/1000) * decel / (1-decel);
    return Math.max(-H*1.5, Math.min(H*1.5, d));
  }

  function onDown(e){
    if (anim){ const s = anim.stop(); anim = null; cur = s.pos; }
    dragging = true; startY = e.clientY; startCur = cur;
    lastY = e.clientY; lastT = performance.now(); lastV = 0;
    sheet.setPointerCapture(e.pointerId);
  }
  function onMove(e){
    if (!dragging) return;
    const dy = e.clientY - startY;
    let y = startCur + dy;
    if (y < 0) y = -y*0.28;                       // 向上：橡胶阻力
    place(y);
    const now = performance.now(), dt = now - lastT;
    if (dt >= 8){
      const v = (e.clientY - lastY) / (dt/1000);
      lastV = Math.max(-6000, Math.min(6000, v));   // 采样间隔太小会放大出天文数字
      lastY = e.clientY; lastT = now;
    }
  }
  function onUp(){
    if (!dragging) return;
    dragging = false;
    if (performance.now() - lastT > 90) lastV = 0;
    const projected = cur + project(lastV);
    if (lastV > 900 || projected > H*0.38) { close(cur, lastV); return; }
    if (anim) { anim.stop(); anim = null; }
    if (reduce) { place(0); return; }
    anim = spring({from:cur, to:0, velocity:lastV, damping:0.8, response:0.3, onUpdate:place});
  }
  sheet.addEventListener('pointerdown', onDown);
  sheet.addEventListener('pointermove', onMove);
  sheet.addEventListener('pointerup', onUp);
  sheet.addEventListener('pointercancel', onUp);
  scrim.addEventListener('click', () => close());
  cta.addEventListener('click', (e) => { e.preventDefault(); open(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) close(); });
})();
</script>
</body>
