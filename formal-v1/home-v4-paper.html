<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>校园请假 · 首页（纸感版）</title>
<!--
  沿用 archive/frontend-demo-designsystem-20261017 的 token：
  纸 #FBFAF7 / 墨 #15202E / 蓝 #2563C9 / 线 #E7E3D9 / 等宽数字
  记忆点：把请假区间画成一把刻度尺（测量时间，而不是再放一个进度条）
  约束：单文件、零依赖、双击可开；触控目标 ≥44px；支持 reduced-motion
-->
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --paper:#FBFAF7; --paper-2:#F5F3EC; --surface:#fff;
    --ink:#15202E; --ink-2:#55606F; --ink-3:#6B6559;
    --line:#E7E3D9; --line-2:#D8D3C6;
    --blue-50:#EFF4FD; --blue-100:#DCE8FA; --blue-500:#2563C9; --blue-600:#1F55AD; --blue-700:#194089;
    --red-600:#B23A28; --red-50:#FBECE9;
    --mono:ui-monospace,"SFMono-Regular","Cascadia Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
    --r-sm:6px; --r-md:10px; --r-lg:14px;
  }
  html,body{height:100%}
  body{
    margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    padding:32px 16px;background:#EDEAE2;color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:2px solid var(--blue-500);outline-offset:2px;border-radius:4px}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* 手机与纸纹 */
  .phone{
    position:relative;width:375px;height:812px;overflow:hidden;
    background:var(--paper);border-radius:28px;
    box-shadow:0 24px 60px -30px rgba(21,32,46,.42),0 0 0 1px rgba(21,32,46,.07);
    background-image:
      linear-gradient(to right,rgba(21,32,46,.032) 1px,transparent 1px),
      linear-gradient(to bottom,rgba(21,32,46,.032) 1px,transparent 1px);
    background-size:64px 64px;
  }

  /* 状态栏 */
  .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;
             padding:0 24px 0 20px;font-size:12px;font-weight:600;letter-spacing:.01em}
  .sb{display:flex;align-items:center;gap:5px}
  .bars{display:flex;align-items:flex-end;gap:2px;height:11px}
  .bars i{width:3px;border-radius:.8px;background:var(--ink)}
  .bars i:nth-child(1){height:4.5px}.bars i:nth-child(2){height:6.5px}
  .bars i:nth-child(3){height:9px}.bars i:nth-child(4){height:11.5px}

  /* 顶部 */
  .head{position:relative;padding:2px 20px 14px}
  .head__kicker{display:flex;align-items:center;gap:8px;
                font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink-3)}
  .head__kicker::after{content:"";flex:1;height:1px;background:var(--line)}
  .head__row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .head h1{margin:0;font-size:19px;line-height:26px;font-weight:650;letter-spacing:-.02em}
  .bell{position:relative;width:44px;height:44px;margin:-10px -10px -10px 0;border-radius:50%;
        display:flex;align-items:center;justify-content:center}
  .bell svg{width:21px;height:21px;fill:none;stroke:var(--ink);stroke-width:1.7;
            stroke-linecap:round;stroke-linejoin:round}
  .bell i{position:absolute;right:12px;top:11px;width:6px;height:6px;border-radius:50%;
          background:var(--red-600);box-shadow:0 0 0 1.5px var(--paper)}

  /* 单据头 */
  .slip-head{display:flex;align-items:baseline;justify-content:space-between;
             padding:0 20px 12px;font-family:var(--mono);font-size:11px;
             letter-spacing:.04em;color:var(--ink-3)}
  .slip-head b{font-weight:400;color:var(--ink-3)}

  /* 核心区 */
  .core{padding:0 20px 4px}
  .core__state{font-size:12px;line-height:18px;font-weight:600;color:var(--blue-700);letter-spacing:2px}
  .core__label{margin-top:14px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink-3)}
  .core__big{margin-top:2px;font-family:var(--mono);font-size:58px;line-height:64px;font-weight:500;
             letter-spacing:-2.4px;color:var(--ink)}
  .core__unit{margin-top:2px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--ink-3)}
  .core__span{margin-top:14px;font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--ink-2)}
  .core__span em{font-style:normal;color:var(--line-2);margin:0 5px}

  /* 刻度尺：本页的记忆点 */
  .ruler{margin:18px 0 4px;position:relative}
  .ruler__track{position:relative;height:40px;border-bottom:1px solid var(--line-2)}
  .ruler__range{position:absolute;left:0;bottom:0;width:62%;height:40px;z-index:1;
    background:linear-gradient(180deg,rgba(37,99,201,.045),rgba(37,99,201,.11));
    border-bottom:2px solid var(--blue-500)}
  /* 刻度浮在填充之上，向左已过段也能看见 */
  .ruler__grid{position:absolute;inset:0;z-index:2;pointer-events:none;
    background-image:linear-gradient(to right,rgba(21,32,46,.20) 1px,transparent 1px);
    background-size:calc(100% / 12) 8px;background-repeat:repeat-x;background-position:left bottom}
  .ruler__grid::after{content:"";position:absolute;left:0;right:0;bottom:0;height:15px;
    background-image:linear-gradient(to right,rgba(21,32,46,.34) 1px,transparent 1px);
    background-size:calc(100% / 6) 15px;background-repeat:repeat-x}
  .ruler__now{position:absolute;left:62%;bottom:0;width:2px;height:40px;background:var(--blue-600);z-index:3}
  .ruler__now::after{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;
    background:var(--blue-600)}
  .ruler__labs{display:flex;justify-content:space-between;margin-top:8px}
  .ruler__labs span{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.02em;
    transform:translateX(-50%)}
  .ruler__labs span:first-child{transform:none}
  .ruler__labs span:last-child{transform:translateX(-100%)}

  /* 两列事实 */
  .facts{display:flex;margin:14px 0 0;padding:14px 0 16px;
         border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .facts > div{flex:1;min-width:0}
  .facts > div + div{padding-left:18px;border-left:1px solid var(--line)}
  .facts span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink-3)}
  .facts b{display:block;margin-top:6px;font-size:15px;line-height:22px;font-weight:600;letter-spacing:-.01em}

  /* 操作 */
  .cta{
    display:flex;align-items:center;justify-content:center;width:100%;height:52px;margin-top:18px;
    border-radius:var(--r-md);background:var(--blue-500);color:#fff;
    font-size:15px;font-weight:600;letter-spacing:.08em;
    box-shadow:0 8px 20px -8px rgba(37,99,201,.55);
    transition:transform .28s cubic-bezier(.2,.8,.25,1),background .18s;
  }
  .cta:hover{background:var(--blue-600)}
  .cta:active{transform:scale(.98);transition-duration:.1s}
  .sub{display:flex;align-items:center;justify-content:center;width:100%;height:44px;margin-top:2px;
       font-size:13px;font-weight:500;color:var(--blue-600);letter-spacing:.02em}

  /* 最近记录 */
  .sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 10px}
  .sec h2{margin:0;font-size:14px;line-height:20px;font-weight:650;letter-spacing:.02em}
  .sec span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink-3)}
  .rec{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    height:64px;padding:0 14px;margin-bottom:8px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
    box-shadow:0 1px 0 rgba(21,32,46,.03);
  }
  .rec__l{display:flex;align-items:baseline;gap:10px;min-width:0}
  .rec__d{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.02em}
  .rec__t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rec svg{width:15px;height:15px;flex:0 0 15px;fill:none;stroke:var(--line-2);
           stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* tabbar */
  .tabbar{
    position:absolute;left:0;right:0;bottom:0;height:52px;
    display:flex;align-items:stretch;
    background:rgba(251,250,247,.94);
    -webkit-backdrop-filter:saturate(1.4) blur(10px);
    backdrop-filter:saturate(1.4) blur(10px);
    border-top:1px solid var(--line);
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .tabbar{background:var(--paper)}
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
       font-size:10px;line-height:12px;color:var(--ink-3);letter-spacing:.04em}
  .tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;
           stroke-linecap:round;stroke-linejoin:round}
  .tab.on{color:var(--blue-600)}
  .tab.on::before{content:"";position:absolute;top:0;width:20px;height:2px;background:var(--blue-600)}
  .tab{position:relative}

  .body{flex:1;overflow-y:auto;padding-bottom:52px}
  .caption{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:#7A7468}

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>
</head>
<body>

<div class="phone">

  <div class="statusbar">
    <span class="mono">9:41</span>
    <span class="sb">
      <span class="bars"><i></i><i></i><i></i><i></i></span>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none">
        <path d="M1 3.6a8.6 8.6 0 0 1 13 0" stroke="#15202E" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M3.4 6.2a5.4 5.4 0 0 1 8.2 0" stroke="#15202E" stroke-width="1.3" stroke-linecap="round"/>

      </svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none">

  <header class="head">

        <i></i>
      </button>
    </div>
  </header>

  <div class="body">

    <section class="core">

  </div>

  <nav class="tabbar" aria-label="主导航">

</html>
