<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>校园请假 · 学生端原型</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== 内联 SVG 图标集（24×24 线性，stroke 1.6） ===== -->
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8.5 6h12M8.5 12h12M8.5 18h12M3.8 6h.01M3.8 12h.01M3.8 18h.01"/></symbol>
  <symbol id="i-msg" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7.5" r="4"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6.5 9.2 17.3 4 12.1"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3.6 21.6 20.4H2.4z"/><path d="M12 9.6v4.6"/><path d="M12 17.4h.01"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11.2v5.2"/><path d="M12 7.8h.01"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.4V12l3.4 2"/></symbol>
  <symbol id="i-gate" viewBox="0 0 24 24"><path d="M3.4 20.6V9.2L12 3.6l8.6 5.6v11.4"/><path d="M9.2 20.6v-5.8a2.8 2.8 0 0 1 5.6 0v5.8"/><path d="M3.4 20.6h17.2"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4.4 19.2V5.4A1.8 1.8 0 0 1 6.2 3.6H20v17H6.2a1.8 1.8 0 0 0-1.8 1.8z"/><path d="M8.6 3.6v17"/></symbol>
  <symbol id="i-book-check" viewBox="0 0 24 24"><path d="M4.4 19.2V5.4A1.8 1.8 0 0 1 6.2 3.6H20v17H6.2a1.8 1.8 0 0 0-1.8 1.8z"/><path d="M11 11.6l2 2 3.4-3.8"/></symbol>
  <symbol id="i-door" viewBox="0 0 24 24"><path d="M5.4 20.6V4.4a1 1 0 0 1 1-1h9.2a1 1 0 0 1 1 1v16.2"/><path d="M2.8 20.6h18.4"/><path d="M12.6 12.2h.01"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M14.4 4h4.2a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4.2"/><path d="M9.6 8.2 13.4 12l-3.8 3.8"/><path d="M13.4 12H3.6"/></symbol>
  <symbol id="i-building" viewBox="0 0 24 24"><path d="M4.4 20.6V6.2L12 3.4l7.6 2.8v14.4"/><path d="M2.8 20.6h18.4"/><path d="M9.4 20.6v-4.4h5.2v4.4"/><path d="M9.4 10h.01M14.6 10h.01"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15"/><path d="M13 6l6 6-6 6"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><path d="M3.4 8.2A1.8 1.8 0 0 1 5.2 6.4h2.6l1.4-1.9h5.6l1.4 1.9h2.6a1.8 1.8 0 0 1 1.8 1.8v9.4a1.8 1.8 0 0 1-1.8 1.8H5.2a1.8 1.8 0 0 1-1.8-1.8z"/><circle cx="12" cy="12.6" r="3.2"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21.2s6.8-5.6 6.8-10.8a6.8 6.8 0 1 0-13.6 0c0 5.2 6.8 10.8 6.8 10.8z"/><circle cx="12" cy="10.2" r="2.6"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.6" y="5.4" width="16.8" height="15" rx="1.8"/><path d="M3.6 10h16.8M8.4 3.6v3.2M15.6 3.6v3.2"/></symbol>
  <symbol id="i-empty" viewBox="0 0 72 72"><rect x="14" y="12" width="44" height="50" rx="4"/><path d="M24 26h24M24 36h24M24 46h14"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.4 12a8.4 8.4 0 1 1-2.6-6.1"/><path d="M20.6 4.4v5h-5"/></symbol>
</svg>

<div class="stage">
  <div class="phone" id="phone">
    <div class="screen" id="screen">

      <!-- ===== 状态栏（静态展示，不交互） ===== -->
      <div class="statusbar" aria-hidden="true">
        <span class="statusbar__time" id="statusbarTime">18:30</span>
        <span class="statusbar__icons">
          <i class="sb-signal"><b></b><b></b><b></b><b></b></i>
          <svg class="sb-wifi" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10 10 0 0 1 14 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M3.6 7a6.4 6.4 0 0 1 8.8 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="9.8" r="1.2" fill="currentColor"/></svg>
          <i class="sb-batt"><b></b></i>
        </span>
      </div>

      <!-- ===== 页面栈：4 个 tab 页常驻 + 5 个 push 页外壳（按需克隆） ===== -->
      <div class="stack" id="stack">
        <section class="page" data-page="S1" data-kind="tab" aria-label="首页"></section>
        <section class="page" data-page="S3" data-kind="tab" aria-label="请假记录"></section>
        <section class="page" data-page="S7" data-kind="tab" aria-label="消息"></section>
        <section class="page" data-page="S9" data-kind="tab" aria-label="我的"></section>

        <section class="page page--push" data-page="S2" data-kind="push" hidden></section>
        <section class="page page--push" data-page="S4" data-kind="push" hidden></section>
        <section class="page page--push" data-page="S5" data-kind="push" hidden></section>
        <section class="page page--push" data-page="S6" data-kind="push" hidden></section>
        <section class="page page--push" data-page="S8" data-kind="push" hidden></section>

        <div class="push-layer" id="pushLayer"></div>
      </div>

      <!-- ===== 底部 tabBar ===== -->
      <nav class="tabbar" id="tabbar" role="tablist" aria-label="主导航">
        <button class="tabbar__item" role="tab" data-action="tab" data-id="S1" aria-selected="true">
          <svg class="icon icon--24"><use href="#i-home"/></svg><span>首页</span>
        </button>
        <button class="tabbar__item" role="tab" data-action="tab" data-id="S3" aria-selected="false">
          <svg class="icon icon--24"><use href="#i-list"/></svg><span>请假记录</span>
        </button>
        <button class="tabbar__item" role="tab" data-action="tab" data-id="S7" aria-selected="false">
          <svg class="icon icon--24"><use href="#i-msg"/></svg><span>消息</span>
          <span class="tabbar__pill" id="msgPill" hidden>1</span>
        </button>
        <button class="tabbar__item" role="tab" data-action="tab" data-id="S9" aria-selected="false">
          <svg class="icon icon--24"><use href="#i-user"/></svg><span>我的</span>
        </button>
      </nav>

      <!-- ===== 浮层根：Toast / 弹窗 / 底部面板 ===== -->
      <div id="layerRoot"></div>

      <!-- ===== 首次引导（不遮挡主流程） ===== -->
      <div class="onboard" id="onboard" hidden>
        <div class="onboard__title">欢迎使用校园请假</div>
        <p class="onboard__line">需要请假时，从首页进入「申请请假」。</p>
        <p class="onboard__line">提交后可在「请假记录」查看审批进度。</p>
        <p class="onboard__line">审批结果和重要提醒会出现在「消息」。</p>
        <button class="btn btn--primary btn--sm" data-action="onboard-ok">知道了</button>
      </div>

    </div>
  </div>

  <!-- ===== 演示控制入口：已移出手机壳，桌面停靠壳右侧外，窄屏回落到壳内右下（由 app.js updateFabPos 定位） ===== -->
  <div class="demo-anchor" id="demoAnchor">
    <button class="demo-fab" id="demoFab" data-action="demo-open" aria-haspopup="dialog">演示</button>
    <button class="demo-hot" id="demoHot" data-action="demo-open" aria-label="打开演示控制" hidden></button>
  </div>

  <p class="stage__caption">校园请假 · 学生端原型 ｜ 点击「演示」可切换状态</p>
</div>

<script src="app.js"></script>
</body>
</html>
