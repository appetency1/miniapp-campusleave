<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#141821" />
<title>离校返校销假 · 返程</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stage">
    <div class="phone" id="phone">

      <!-- Step 1 · 返程 -->
      <section class="screen screen--return is-active" id="screen-return" aria-label="返程">
        <div class="return-hero">
          <img class="hero__img" src="assets/gate-dusk.jpg" alt="傍晚的校门" />
          <div class="hero__shade"></div>
          <div class="hero__content">
            <div class="kicker">返程</div>
            <div class="trip">
              <span class="trip__point" id="trip-from"></span>
              <span class="trip__leg">
                <i class="trip__dash"></i>
                <i class="ic" data-icon="car" data-size="15"></i>
                <i class="ic" data-icon="arrow-right" data-size="15"></i>
                <i class="trip__dash"></i>
              </span>
              <span class="trip__point" id="trip-to"></span>
            </div>
          </div>
        </div>

        <div class="return-body">
          <article class="pass">
            <header class="pass__head">
              <div class="pass__who">
                <div class="pass__name" id="pass-name"></div>
                <div class="pass__sid mono" id="pass-sid"></div>
              </div>
              <div class="pill">
                <span class="pill__dot"></span>
                <span class="pill__label" id="pass-status-label"></span>
              </div>
            </header>

            <div class="pass__count">
              <div class="label">距批准结束</div>
              <div class="count mono" id="countdown"></div>
            </div>

            <div class="grid2">
              <div class="cell"><div class="label">请假类型</div><div class="val" id="g-type"></div></div>
              <div class="cell"><div class="label">场景</div><div class="val" id="g-scene"></div></div>
              <div class="cell"><div class="label">准假时段</div><div class="val mono" id="g-period"></div></div>
              <div class="cell"><div class="label">辅导员</div><div class="val" id="g-counselor"></div></div>
            </div>

            <div class="perf">
              <span class="perf__notch perf__notch--l"></span>
              <span class="perf__notch perf__notch--r"></span>
            </div>

            <footer class="pass__stub">
              <div class="barcode" aria-hidden="true"></div>
              <div class="pass__code mono" id="pass-code"></div>
            </footer>
          </article>

          <div class="cta">
            <button class="btn btn--primary" id="btn-locate">
              <i class="ic" data-icon="navigation" data-size="20"></i>
              <span>返校定位销假</span>
            </button>
            <button class="btn btn--ghost" id="btn-renew">
              <i class="ic" data-icon="refresh" data-size="18"></i>
              <span>申请续假</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Step 2 · 定位 -->
      <section class="screen screen--locate" id="screen-locate" aria-label="定位核验">
        <div class="seg" id="seg">
          <button class="seg__btn is-active" data-value="pass" type="button">模拟：通过</button>
          <button class="seg__btn" data-value="fail" type="button">模拟：超范围</button>
        </div>

        <div class="locate-stage">
          <div class="radar" id="radar">
            <span class="radar__ring"></span>
            <span class="radar__ring"></span>
            <span class="radar__ring"></span>
            <span class="radar__core"><i class="ic" data-icon="navigation" data-size="26"></i></span>
          </div>
          <div class="locate__status" id="locate-status"></div>
          <div class="locate__steps">
            <div class="locate__step is-on">
              <i class="ic" data-icon="check" data-size="15"></i>
              <span id="locate-step1-text"></span>
            </div>
            <div class="locate__step" id="locate-step2">
              <i class="ic" data-icon="refresh" data-size="15"></i>
              <span id="locate-step2-text"></span>
            </div>
          </div>
        </div>

        <div class="result" id="result-card" data-state="pass">
          <div class="result__icon" id="result-icon"></div>
          <div class="result__dist">
            <span class="mono" id="locate-distance">0</span>
            <span class="result__unit" id="locate-unit"></span>
          </div>
          <div class="result__note" id="locate-note"></div>
          <div class="chip mono" id="locate-chip" hidden></div>
          <div class="result__actions">
            <button class="btn btn--ghost btn--sm" id="btn-recheck" type="button" hidden>
              <i class="ic" data-icon="refresh" data-size="16"></i><span>重新定位</span>
            </button>
            <button class="btn btn--primary btn--sm" id="btn-verify" type="button" hidden>
              <i class="ic" data-icon="user-check" data-size="16"></i><span>申请人工核验</span>
            </button>
            <button class="btn btn--primary btn--sm" id="btn-home" type="button" hidden>
              <i class="ic" data-icon="house" data-size="16"></i><span>返回首页</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Step 3 · 完成 -->
      <section class="screen screen--done" id="screen-done" aria-label="销假完成">
        <div class="done-wrap">
          <div class="stamp" id="stamp"><span>已销假</span></div>
          <h1 class="done__title">已销假</h1>
          <div class="done__sub">实际结束 <span class="mono" id="done-end"></span></div>
          <div class="timeline" id="timeline"></div>
          <button class="btn btn--primary" id="btn-home2" type="button">
            <i class="ic" data-icon="house" data-size="18"></i><span>返回首页</span>
          </button>
        </div>
      </section>

      <!-- 顶部状态栏（悬浮于全部步骤之上） -->
      <div class="statusbar" aria-hidden="true">
        <div class="sb__time mono" id="sb-time"></div>
        <div class="sb__icons">
          <i class="ic" data-icon="signal" data-size="16"></i>
          <i class="ic" data-icon="wifi" data-size="16"></i>
          <i class="ic" data-icon="battery" data-size="18"></i>
        </div>
      </div>

      <!-- 人工核验 sheet -->
      <div class="scrim" id="sheet-scrim" hidden></div>
      <div class="sheet" id="sheet" role="dialog" aria-label="申请人工核验">
        <div class="sheet__grab"></div>
        <div class="sheet__head">
          <div class="sheet__title">申请人工核验</div>
          <button class="iconbtn" id="sheet-close" type="button" aria-label="关闭">
            <i class="ic" data-icon="x" data-size="20"></i>
          </button>
        </div>
        <p class="sheet__hint">位置超出允许范围时，可提交人工核验，由辅导员复核后完成销假。</p>
        <textarea class="sheet__input" id="sheet-input" rows="4" placeholder="请填写核验事由，如：已在返校途中，GPS 信号偏差"></textarea>
        <button class="btn btn--primary" id="sheet-submit" type="button">
          <i class="ic" data-icon="send" data-size="18"></i><span>提交核验申请</span>
        </button>
      </div>

      <!-- toast -->
      <div class="toast" id="toast" hidden></div>
    </div>
  </div>

  <script src="mock.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
