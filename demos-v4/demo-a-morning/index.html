<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>校园请假 · 晨光</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone" id="phone">

  <!-- 整屏底图 + 柔光 scrim -->
  <div class="bg" aria-hidden="true">
    <img src="assets/campus-dawn.jpg" alt="">
  </div>
  <div class="scrim" aria-hidden="true"></div>

  <!-- 状态栏（图标为内联 SVG，时间为动态渲染） -->
  <header class="statusbar">
    <span class="statusbar__time" id="statusTime">11:32</span>
    <span class="statusbar__icons" aria-hidden="true">
      <svg class="sb-ico" width="17" height="12" viewBox="0 0 17 12" fill="none">
        <rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/>
        <rect x="4.5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/>
        <rect x="9" y="3" width="3" height="9" rx="1" fill="currentColor"/>
        <rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor" fill-opacity=".32"/>
      </svg>
      <svg class="sb-ico" width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01"/>
        <path d="M2 8.82a15 15 0 0 1 20 0"/>
        <path d="M5 12.86a10 10 0 0 1 14 0"/>
        <path d="M8.5 16.43a5 5 0 0 1 7 0"/>
      </svg>
      <svg class="sb-ico" width="25" height="13" viewBox="0 0 25 13" fill="none">
        <rect x="0.5" y="0.5" width="21" height="12" rx="3.5" stroke="currentColor" stroke-opacity=".38"/>
        <rect x="2" y="2" width="15" height="9" rx="1.8" fill="currentColor"/>
        <rect x="23" y="4.2" width="1.6" height="4.6" rx="0.8" fill="currentColor" fill-opacity=".38"/>
      </svg>
    </span>
  </header>

  <!-- 可滚动内容区（单屏流式） -->
  <main class="screen" id="screen">
    <div class="pagehead reveal" style="--d:.05s" id="pagehead"></div>
    <section class="hero reveal" style="--d:.12s" id="hero"></section>
    <section class="cardwrap reveal" style="--d:.20s" id="card"></section>
    <nav class="filterbar reveal" style="--d:.30s" id="filter" aria-label="请假记录筛选"></nav>
    <section class="list" id="list"></section>
    <div class="tailspace" aria-hidden="true"></div>
  </main>

  <!-- 底部 tabbar -->
  <nav class="tabbar" id="tabbar" aria-label="主导航"></nav>

  <!-- 浮层：底部 sheet -->
  <div class="sheet-scrim" id="sheetScrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>

  <!-- toast -->
  <div class="toast-host" id="toastHost" aria-live="polite" aria-atomic="true"></div>

</div>

<script src="mock.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
