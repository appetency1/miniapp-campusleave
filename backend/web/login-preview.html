<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园请假 · 登录（改版预览）</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  /* ============================================================
     登录页改版 · 第二版（自定方案，不再参照外部稿）
     左插画 / 右表单。右侧不做"居中卡片"，做成一张「单据」：
     表头 + 细线，字段是"项目 · 内容"两栏的表行，
     登录成功时盖一枚朱红「准」章 —— 和插画里那枚印章同色。
     只引用 tokens.css 取色板，其余全部在这里。
     ============================================================ */

  body { background: #FBFAF6; }
  .lp { min-height: 100vh; min-height: 100dvh; }

  .lp-shell {
    display: grid;
    grid-template-columns: 52fr 48fr;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* ---------- 左：插画 ---------- */
  .lp-art {
    position: relative;
    overflow: hidden;
    background: #D8CCBC;
  }
  .lp-art img {
    position: absolute;      /* 脱离文档流：否则 <img> 的固有高度会把整行撑高约 36px */
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 60%;
  }

  /* ---------- 右：单据 ---------- */
  .lp-form {
    display: flex;
    flex-direction: column;
    padding: 36px clamp(40px, 5vw, 72px) 34px;
    background: #FBFAF6;
  }
  .lp-inner {
    width: 100%;
    max-width: 448px;
    margin: 0 auto;          /* 在右半栏里居中，而不是贴住分割线 */
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  /* 表头：左品牌 + 右身份，下面一条细线，像公文的抬头 */
  .lp-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 18px;
    border-bottom: 1px solid #DDE3D6;
  }
  .lp-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: .06em;
    color: var(--ink);
  }
  .lp-mark {
    width: 10px; height: 10px;
    border-radius: 2px;
    background: #C2603F;
    flex: none;
  }
  .lp-role {
    font-size: 13px;
    letter-spacing: .1em;
    color: var(--ink-3);
  }

  .lp-body {
    flex: 1;
    padding-top: clamp(48px, 11vh, 132px);
  }

  .lp-titlerow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }
  .lp-title {
    margin: 0;
    font-family: var(--mono);
    font-size: clamp(36px, 3.2vw, 46px);
    line-height: 1.15;
    font-weight: 600;
    letter-spacing: .01em;
    color: var(--ink);
  }
  .lp-sub {
    margin: 12px 0 0;
    font-size: 16px;
    line-height: 1.7;
    letter-spacing: .03em;
    color: var(--ink-2);
  }

  /* 盖章：登录成功后落在标题右侧 */
  .lp-seal {
    flex: none;
    width: 46px; height: 46px;
    display: grid;
    place-items: center;
    border: 2px solid #C2603F;
    border-radius: 4px;
    color: #C2603F;
    font-family: var(--mono);
    font-size: 26px;
    line-height: 1;
    padding-bottom: 2px;
    opacity: 0;
    transform: scale(1.65) rotate(-16deg);
    pointer-events: none;
  }
  .lp-seal.is-on {
    opacity: 1;
    transform: scale(1) rotate(-7deg);
    transition: transform 320ms var(--ease), opacity 180ms var(--ease-tog);
  }

  /* ---------- 表行 ---------- */
  .lp-form-el { margin-top: 44px; }

  .lp-row {
    display: grid;
    grid-template-columns: 76px 1fr;
    align-items: center;
    border-bottom: 1.5px solid #94A28E;
    transition: border-color var(--t-fast) var(--ease-tog),
                box-shadow var(--t-fast) var(--ease-tog);
  }
  .lp-row + .lp-row { margin-top: 4px; }

  .lp-row label {
    font-size: 14px;
    letter-spacing: .1em;
    color: var(--ink-2);
    cursor: text;
    transition: color var(--t-fast) var(--ease-tog);
  }
  .lp-row input {
    width: 100%;
    padding: 14px 0;
    font-size: 18px;
    line-height: 1.4;
    color: var(--ink);
    background: transparent;
    border: 0;
    outline: none;
  }
  .lp-row input::placeholder { color: var(--ink-4); font-size: 16.5px; }
  .lp-row input.mono { font-family: var(--mono); letter-spacing: .03em; }

  .lp-row:hover { border-bottom-color: #7E8F7A; }
  .lp-row:focus-within {
    border-bottom-color: var(--blue-600);
    box-shadow: 0 1px 0 0 var(--blue-600);
  }
  .lp-row:focus-within label { color: var(--blue-600); }

  .lp-row.is-error { border-bottom-color: var(--red-600); box-shadow: 0 1px 0 0 var(--red-600); }
  .lp-row.is-error label { color: var(--red-600); }

  /* ---------- 操作 ---------- */
  .lp-submit {
    width: 100%;
    height: 48px;
    margin-top: 34px;
    border-radius: 6px;
    background: #34573E;
    color: #fff;
    font-size: 15.5px;
    letter-spacing: .3em;
    text-indent: .3em;
    transition: background var(--t-fast) var(--ease-tog),
                transform var(--t-fast) var(--ease);
  }
  .lp-submit:hover:not(:disabled) { background: #2C4A35; }
  .lp-submit:active:not(:disabled) { transform: translateY(1px); }
  .lp-submit:disabled { opacity: .55; cursor: default; }
  .lp-submit:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 3px; }

  .lp-alt {
    margin-top: 16px;
    font-size: 14px;
    color: var(--ink-2);
    text-decoration: underline;
    text-underline-offset: 5px;
    text-decoration-color: var(--line-2);
    transition: color var(--t-fast) var(--ease-tog),
                text-decoration-color var(--t-fast) var(--ease-tog);
  }
  .lp-alt:hover { color: var(--blue-600); text-decoration-color: var(--blue-500); }
  .lp-alt:focus-visible { outline: 2px solid var(--blue-500); outline-offset: 4px; border-radius: 3px; }

  .lp-hint {
    margin: 22px 0 0;
    min-height: 42px;
    font-size: 13.5px;
    line-height: 1.75;
    color: var(--ink-3);
    transition: color var(--t-sel) var(--ease-tog);
  }
  .lp-hint.is-warn { color: var(--amber-600); }
  .lp-hint.is-ok   { color: var(--blue-600); }
  .lp-hint .mono { font-family: var(--mono); user-select: all; }

  .lp-foot {
    margin-top: 32px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .08em;
    color: var(--ink-4);
  }

  /* ---------- 入场 ---------- */
  @keyframes lp-rise {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }
  .lp-art, .lp-head, .lp-title, .lp-sub, .lp-row, .lp-submit, .lp-alt, .lp-hint {
    animation: lp-rise 420ms var(--ease) both;
  }
  .lp-art    { animation-delay: 0ms; }
  .lp-head   { animation-delay: 60ms; }
  .lp-title  { animation-delay: 90ms; }
  .lp-sub    { animation-delay: 130ms; }
  .lp-row:nth-of-type(1) { animation-delay: 190ms; }
  .lp-row:nth-of-type(2) { animation-delay: 230ms; }
  .lp-submit { animation-delay: 280ms; }
  .lp-alt    { animation-delay: 320ms; }
  .lp-hint   { animation-delay: 360ms; }

  /* ---------- 断点 ---------- */
  @media (max-width: 1279px) {
    .lp-form { padding-left: 64px; padding-right: 48px; }
    .lp-title { font-size: 38px; }
  }
  @media (max-width: 1023px) {
    .lp-shell { grid-template-columns: 44fr 56fr; }
    .lp-form { padding-left: 52px; padding-right: 44px; }
    .lp-title { font-size: 34px; }
    .lp-body { padding-top: 8vh; }
  }
  @media (max-width: 859px) {
    .lp-shell { grid-template-columns: 1fr; }
    /* 窄屏直接撤掉插画：200px 高的横条只能切到熊的半张脸，不如不要 */
    .lp-art { display: none; }
    .lp-form { padding: 28px 24px 26px; }
    .lp-inner { max-width: 420px; }
    .lp-body { padding-top: 44px; flex: none; }
    .lp-title { font-size: 32px; }
    .lp-form-el { margin-top: 36px; }
  }
</style>
</head>
<body>
<div class="lp">
  <div class="lp-shell">

    <div class="lp-art">
      <img src="assets/login-art.jpg"
           alt="插画：一只穿深绿卫衣的小熊坐在办公桌前批阅请假单，桌上有一枚印章、一杯茶和一盆蕨类，窗外是教学楼、树和骑车经过的学生">
    </div>

    <section class="lp-form">
      <div class="lp-inner">

        <div class="lp-head">
          <div class="lp-brand"><span class="lp-mark" aria-hidden="true"></span>校园请假</div>
          <div class="lp-role">教师 · 管理员</div>
        </div>

        <div class="lp-body">
          <div class="lp-titlerow">
            <h1 class="lp-title">欢迎回来</h1>
            <span class="lp-seal" id="seal" aria-hidden="true">准</span>
          </div>
          <p class="lp-sub">用学校发放的工号登录</p>

          <form class="lp-form-el" novalidate>
            <div class="lp-row" id="r-acc">
              <label for="acc">工号</label>
              <input id="acc" class="mono" name="acc" type="text" autocomplete="username"
                     spellcheck="false" placeholder="如 T2023001">
            </div>

            <div class="lp-row" id="r-pwd">
              <label for="pwd">密码</label>
              <input id="pwd" name="pwd" type="password" autocomplete="current-password"
                     placeholder="请输入密码">
            </div>

            <button class="lp-submit" type="submit">登录</button>
            <button class="lp-alt" type="button" id="fill-demo">填入演示账号</button>

            <p class="lp-hint" id="hint" role="status" aria-live="polite">
              账号由学校统一发放，忘记密码请联系管理员
            </p>
          </form>
        </div>

        <div class="lp-foot">v0.4 · 2026 · 改版预览（未连接后端）</div>
      </div>
    </section>

  </div>
</div>

<script>
(function () {
  var acc  = document.getElementById('acc');
  var pwd  = document.getElementById('pwd');
  var hint = document.getElementById('hint');
  var btn  = document.querySelector('.lp-submit');
  var alt  = document.getElementById('fill-demo');
  var seal = document.getElementById('seal');
  var rAcc = document.getElementById('r-acc');
  var rPwd = document.getElementById('r-pwd');

  var DEMO = { no: 'T2023001', pwd: '123456' };
  var STUDENT = '2023001001';
  var IDLE = '账号由学校统一发放，忘记密码请联系管理员';
  var busy = false;

  function say(text, kind) {
    hint.textContent = text;
    hint.className = 'lp-hint' + (kind ? ' is-' + kind : '');
  }
  function clearErr() {
    rAcc.classList.remove('is-error');
    rPwd.classList.remove('is-error');
  }

  alt.addEventListener('click', function () {
    acc.value = DEMO.no;
    pwd.value = DEMO.pwd;
    clearErr();
    say(IDLE, '');
    acc.focus();
  });

  acc.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); pwd.focus(); }
  });

  [acc, pwd].forEach(function (el) {
    el.addEventListener('input', function () {
      clearErr();
      if (hint.className.indexOf('is-') > -1) {
        say(IDLE, '');
        seal.classList.remove('is-on');
      }
    });
  });

  document.querySelector('form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;

    var no = acc.value.trim();
    var pw = pwd.value;

    if (!no) { rAcc.classList.add('is-error'); say('请输入工号', 'warn'); acc.focus(); return; }
    if (!pw) { rPwd.classList.add('is-error'); say('请输入密码', 'warn'); pwd.focus(); return; }

    if (no === STUDENT) {
      say('学生请使用小程序端，Web 后台只给教师与管理员', 'warn');
      return;
    }

    busy = true;
    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    btn.textContent = '登录中…';

    // 预览版不连后端：用演示账号模拟一次往返，把成功 / 失败两种状态走通
    setTimeout(function () {
      busy = false;
      btn.disabled = false;
      btn.removeAttribute('aria-busy');
      btn.textContent = '登录';

      if (no === DEMO.no && pw === DEMO.pwd) {
        say('登录成功 —— 预览版没有后端，这里本该进入工作台', 'ok');
        seal.classList.add('is-on');
      } else {
        rAcc.classList.add('is-error');
        rPwd.classList.add('is-error');
        say('工号或密码不正确。预览版可用 T2023001 / 123456', 'warn');
      }
    }, 900);
  });

  setTimeout(function () { acc.focus(); }, 60);
})();
</script>
</body>
</html>
